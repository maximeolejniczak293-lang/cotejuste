<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoteJuste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan : un outil de pronostic sobre (papier légèrement vert, encre sombre) ;
   la seule audace = le tableau d'affichage de stade, panneau sombre à chiffres ambre. */
:root {
  --paper: #f3f4ef;
  --surface: #fcfcfb;
  --ink: #111613;
  --ink-2: #4a514b;
  --muted: #7d837b;
  --line: #dde0d7;
  --accent: #0f5c43;
  --home: #2a78d6;
  --away: #eb6834;
  --draw: #c3c6bd;
  --good: #0ca30c;
  --good-ink: #006300;
  --critical: #d03b3b;
  --board: #121513;
  --board-2: #1c211d;
  --board-ink: #f1eee3;
  --board-muted: #8f978e;
  --led: #ffb21e;
  --seq-0: #eef4fc; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d100e; --surface: #151916; --ink: #eef0ea; --ink-2: #b8bdb4; --muted: #868c84; --line: #2a302b;
    --accent: #52c494; --home: #3987e5; --away: #d95926; --draw: #4b5049; --good-ink: #2fc42f;
    --board: #0a0c0b; --board-2: #161a17;
    --seq-0: #1b2230; --seq-1: #1a3354; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d100e; --surface: #151916; --ink: #eef0ea; --ink-2: #b8bdb4; --muted: #868c84; --line: #2a302b;
  --accent: #52c494; --home: #3987e5; --away: #d95926; --draw: #4b5049; --good-ink: #2fc42f;
  --board: #0a0c0b; --board-2: #161a17;
  --seq-0: #1b2230; --seq-1: #1a3354; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* ---------- en-tête */
header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
.top-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 14px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
.brand b { font: 800 28px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs a { text-decoration: none; padding: 8px 14px; border-radius: 8px; font: 600 16px/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--surface); }
nav.tabs a:hover:not([aria-current="page"]) { background: var(--paper); }
.datebar { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 0 0 12px; }
.datebar span.missing { color: var(--ink); cursor: help; }
.datebar span.missing::before { background: var(--led); }
.datebar span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 2px; }

main { padding: 24px 0 64px; display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.section-head h2 { font-size: 26px; text-transform: uppercase; }
.section-head p { margin: 2px 0 0; color: var(--ink-2); max-width: 62ch; }

/* ---------- filtres */
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bankroll { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); margin-left: auto; }
.bankroll input { width: 84px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; }

/* ---------- tableau d'affichage (l'élément audacieux) */
.board { background: var(--board); color: var(--board-ink); border-radius: 14px; padding: 18px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.board::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.2px); background-size: 5px 5px; }
.board-label { font: 600 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .14em; color: var(--board-muted); }
.led { font-family: var(--font-display); font-weight: 700; color: var(--led); font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(255,178,30,.35); }
.highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hl { background: var(--board-2); border-radius: 10px; padding: 14px; text-decoration: none; display: grid; gap: 6px; position: relative; z-index: 1; border: 1px solid transparent; }
.hl:hover { border-color: rgba(255,178,30,.4); }
.hl .what { font: 600 13px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .1em; color: var(--board-muted); }
.hl .teams { font: 700 20px/1.15 var(--font-display); text-transform: uppercase; }
.hl .big { font-size: 34px; line-height: 1; }
.hl .sub { font-size: 13px; color: var(--board-muted); }

/* ---------- liste des matchs */
.day { display: grid; gap: 8px; }
.day h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); padding: 4px 0; border-bottom: 1px solid var(--line); }
.match { display: grid; grid-template-columns: 54px 1fr minmax(180px, 1.3fr) 1fr 150px 18px; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-decoration: none; }
.match:hover { border-color: var(--ink-2); }
.match .time { font: 600 16px/1.1 var(--font-display); color: var(--ink-2); }
.match .time small { display: block; font: 600 11px/1.2 var(--font-body); color: var(--muted); letter-spacing: .04em; }
.match .team { font: 700 19px/1.1 var(--font-display); text-transform: uppercase; }
.match .team.h { text-align: right; }
.match .team small { display: block; font: 500 12px/1.3 var(--font-body); text-transform: none; color: var(--muted); }
.match .odds { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font-size: 13px; color: var(--ink-2); }
.match .odds b { display: block; font: 700 16px/1.2 var(--font-display); color: var(--ink); }
.chev { color: var(--muted); font-size: 18px; }
.flagtag { display: inline-block; font: 700 10px/1 var(--font-body); letter-spacing: .06em; padding: 3px 5px; border-radius: 4px; background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); margin-top: 3px; }

/* barre 1N2 */
.bar1n2 { display: flex; gap: 2px; height: 26px; }
.bar1n2 .seg { display: flex; align-items: center; justify-content: center; font: 700 13px/1 var(--font-display); color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
.bar1n2 .seg:first-child { border-radius: 4px 0 0 4px; }
.bar1n2 .seg:last-child { border-radius: 0 4px 4px 0; }
.seg.h { background: var(--home); } .seg.d { background: var(--draw); color: var(--ink); } .seg.a { background: var(--away); }
.bar1n2.thin { height: 10px; } .bar1n2.thin .seg { font-size: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- fiche match */
.back { text-decoration: none; font-weight: 600; color: var(--ink-2); }
.scoreboard { grid-template-columns: 1fr auto 1fr; align-items: center; padding: 26px 22px; }
.sb-team { display: grid; gap: 4px; position: relative; z-index: 1; }
.sb-team.a { text-align: right; }
.sb-team .nm { font: 800 clamp(28px, 4.6vw, 48px)/1 var(--font-display); text-transform: uppercase; }
.sb-team .meta { color: var(--board-muted); font-size: 14px; }
.sb-mid { text-align: center; position: relative; z-index: 1; display: grid; gap: 4px; }
.sb-mid .ko { font: 600 15px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--board-muted); }
.sb-mid .xg { font-size: 44px; line-height: 1; }
.sb-probs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; position: relative; z-index: 1; }
.sb-probs div { background: var(--board-2); border-radius: 10px; padding: 12px; text-align: center; }
.sb-probs .led { font-size: clamp(34px, 5vw, 52px); line-height: 1; display: block; }
.sb-probs small { color: var(--board-muted); font-size: 13px; }
.sb-probs .k { font: 700 14px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--board-ink); display: block; margin-bottom: 6px; }

.grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card h3 { font-size: 20px; text-transform: uppercase; }
.card .hint { color: var(--ink-2); font-size: 14px; margin: -8px 0 0; }
.warn { border-left: 3px solid var(--led); background: var(--surface); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; color: var(--ink-2); }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 600 12px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; position: relative; }

/* calculateur de valeur */
.valtable input { width: 78px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); text-align: right; font-variant-numeric: tabular-nums; }
.verdict { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.verdict.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-ink); }
.verdict.fair { background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); }
.verdict.bad { background: color-mix(in srgb, var(--critical) 10%, transparent); color: var(--critical); }
.verdict.none { color: var(--muted); font-weight: 500; }
.valtable input.api { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; font-size: 14px; }

/* absents et compositions */
.tag { display: inline-block; font: 700 11px/1 var(--font-body); letter-spacing: .03em; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
.tag.out { background: color-mix(in srgb, var(--critical) 12%, transparent); color: var(--critical); }
.tag.doubt { background: color-mix(in srgb, var(--led) 22%, transparent); color: var(--ink-2); }
.tag.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-ink); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.plist li { display: flex; align-items: center; gap: 8px; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.plist li span:first-child { min-width: 0; }
.plist .nb { display: inline-block; width: 26px; color: var(--muted); font-variant-numeric: tabular-nums; }
.plist .pos { color: var(--muted); font-size: 12px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
.stamp { font-size: 12px; color: var(--muted); }

/* recos du jour */
.recos { display: grid; gap: 12px; }
.recos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.reco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.reco.fun { border-style: dashed; }
.reco .kind { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.reco .what { font: 700 21px/1.15 var(--font-display); text-transform: uppercase; }
.reco .leg { display: grid; gap: 2px; }
.reco .leg small { color: var(--ink-2); font-size: 13px; }
.reco dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; margin: 0; }
.reco dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.reco dd { margin: 0; font: 700 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.reco dd.key { color: var(--accent); }
.reco ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); display: grid; gap: 3px; }
.reco .stakeline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.conf { font: 700 11px/1 var(--font-body); padding: 4px 7px; border-radius: 999px; letter-spacing: .03em; text-transform: none; }
.conf.Élevée { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-ink); }
.conf.Moyenne { background: color-mix(in srgb, var(--led) 22%, transparent); color: var(--ink-2); }
.conf.Faible { background: color-mix(in srgb, var(--critical) 10%, transparent); color: var(--critical); }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.probtable td, .probtable th { text-align: right; } .probtable td:first-child, .probtable th:first-child { text-align: left; }
.probtable td.fin { font-weight: 700; color: var(--accent); }

/* combiné */
.mwrap { display: grid; }
.mwrap .match { border-radius: var(--radius) var(--radius) 0 0; }
.pickbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 7px 14px; font-size: 13px; color: var(--muted);
  border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--paper); }
.pickbar > span { margin-right: 4px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.pick b { color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 3px; }
.pick.fair b { color: var(--muted); font-weight: 500; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.pick[aria-pressed="true"] b { color: #fff; }
#cart-btn { position: fixed; right: 16px; bottom: 16px; z-index: 40; border: 0; border-radius: 999px; padding: 12px 18px; background: var(--ink); color: var(--surface);
  font: 700 16px/1 var(--font-display); text-transform: uppercase; letter-spacing: .05em; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
#cart-btn[hidden] { display: none; }
#cart { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 45; background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -8px 0 30px rgba(0,0,0,.18); display: grid; grid-template-rows: auto 1fr auto; transform: translateX(105%); transition: transform .18s; }
#cart.open { transform: none; }
#cart header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
#cart header h2 { font-size: 22px; text-transform: uppercase; }
#cart .body { overflow-y: auto; padding: 14px 18px; display: grid; gap: 10px; align-content: start; }
#cart .foot { border-top: 1px solid var(--line); padding: 14px 18px; display: grid; gap: 8px; }
.xbtn { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px; }
.citem { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; font-size: 14px; }
.citem .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.citem .sel { font: 700 16px/1.2 var(--font-display); text-transform: uppercase; }
.citem .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--ink-2); font-size: 13px; }
.citem input, #cart-stake { width: 76px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); text-align: right; font-variant-numeric: tabular-nums; }
.ctot { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.ctot b { font-variant-numeric: tabular-nums; }
.ctot.big b { font: 700 22px/1 var(--font-display); }
.cmsg { font-size: 13px; padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--led); background: var(--paper); color: var(--ink-2); }
.cmsg.err { border-left-color: var(--critical); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* bilan */
.pos-v { color: var(--good-ink); } .neg-v { color: var(--critical); }
.chart svg { display: block; width: 100%; height: auto; touch-action: none; }
.chart .grid line { stroke: var(--line); }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.res { font-weight: 700; font-size: 13px; }
.res.won { color: var(--good-ink); } .res.lost { color: var(--critical); } .res.wait { color: var(--muted); font-weight: 500; }

/* forme */
.form { display: flex; gap: 4px; }
.form span { width: 24px; height: 24px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font: 700 13px/1 var(--font-display); color: #fff; }
.form .V { background: var(--good); } .form .N { background: var(--draw); color: var(--ink); } .form .D { background: var(--critical); }
.teamcol { display: grid; gap: 10px; }
.teamcol h4 { margin: 0; font: 700 18px/1 var(--font-display); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.teamcol h4 i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; font-size: 14px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 4px; gap: 8px; }
.stats b { font-variant-numeric: tabular-nums; }

/* heatmap */
.heat { display: grid; grid-template-columns: 28px repeat(6, 1fr); gap: 2px; font-size: 12px; }
.heat .ax { display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 600; }
.heat .cell { aspect-ratio: 1.35; display: flex; align-items: center; justify-content: center; border-radius: 3px; font: 600 13px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.heatcap { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

ul.insights { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.insights li { padding-left: 18px; position: relative; }
ul.insights li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 2px; background: var(--accent); }

.cmp { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-2); }

/* méthode */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.kpi .v { font: 700 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.kpi .c { font-size: 12px; color: var(--muted); }
.prose { max-width: 70ch; display: grid; gap: 10px; }
.prose p { margin: 0; }
code.f { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--paper); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }

#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--surface); font-size: 13px; padding: 6px 9px; border-radius: 6px; max-width: 260px; opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 13px; }

@media (max-width: 860px) {
  .match { grid-template-columns: 46px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "t h a" "b b b" "o o o"; row-gap: 10px; }
  .match .time { grid-area: t; } .match .team.h { grid-area: h; text-align: left; } .match .team.a { grid-area: a; text-align: right; }
  .match .bar1n2 { grid-area: b; } .match .odds { grid-area: o; } .chev { display: none; }
  .grid2 { grid-template-columns: 1fr; }
  .highlights { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .bankroll { margin-left: 0; }
  nav.tabs { margin-left: 0; width: 100%; }
  nav.tabs a { padding: 7px 10px; font-size: 15px; }
}
@media (max-width: 520px) {
  .wrap { padding: 0 16px; }
  nav.tabs { gap: 2px; justify-content: space-between; }
  nav.tabs a { padding: 7px 6px; font-size: 14px; letter-spacing: .02em; }
  .brand b { font-size: 24px; }
  .reco dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .scoreboard { grid-template-columns: 1fr 1fr; }
  .sb-mid { grid-column: 1 / -1; order: 3; }
  .stats { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <a class="brand" href="#matchs"><b>Cote<span>Juste</span></b><small>Probabilités et cotes justes du foot</small></a>
      <nav class="tabs" aria-label="Sections">
        <a href="#matchs" data-tab="matchs">Matchs</a>
        <a href="#classements" data-tab="classements">Classements</a>
        <a href="#bilan" data-tab="bilan">Bilan</a>
        <a href="#methode" data-tab="methode">Méthode</a>
      </nav>
    </div>
    <div class="datebar" id="datebar"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="tip" role="tooltip"></div>
<button id="cart-btn" type="button" hidden aria-controls="cart">Combiné · 0</button>
<aside id="cart" role="dialog" aria-label="Mon combiné" aria-hidden="true">
  <header><h2>Mon combiné</h2><button class="xbtn" id="cart-close" type="button" aria-label="Fermer">×</button></header>
  <div class="body" id="cart-body"></div>
  <div class="foot" id="cart-foot"></div>
</aside>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const LEAGUES = DATA.leagues;
const TAG = { fr1: "FRA", en1: "ANG", es1: "ESP" };
const store = {
  get(k, d) { try { const v = localStorage.getItem("cotejuste:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cotejuste:" + k, JSON.stringify(v)); } catch (e) {} }
};
const state = { league: store.get("league", "all"), bankroll: store.get("bankroll", 15), bilanSerie: store.get("bilanSerie", "toutes_finale") };

// ---------- utilitaires
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (p, d = 0) => (p * 100).toFixed(d).replace(".", ",") + " %";
const odd = p => p > 0 ? (1 / p).toFixed(2).replace(".", ",") : "–";
const n2 = x => Number(x).toFixed(2).replace(".", ",");
const euro = x => x.toFixed(2).replace(".", ",") + " €";
const signedPct = x => { const r = Math.round(x * 100); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r) + "\u202f%"; };
const parseNum = s => { const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) ? v : NaN; };
const tz = "Europe/Paris";
const fmtDay = iso => new Intl.DateTimeFormat("fr-FR", { timeZone: tz, weekday: "long", day: "numeric", month: "long" }).format(new Date(iso));
const fmtTime = iso => new Intl.DateTimeFormat("fr-FR", { timeZone: tz, hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
const fmtShort = s => new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "2-digit" }).format(new Date(s + "T12:00:00Z"));
const dayKey = iso => new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(new Date(iso));

// liste plate des matchs avec slug stable
const MATCHES = [];
LEAGUES.forEach(L => L.fixtures.forEach(f => MATCHES.push(Object.assign({}, f, { slug: "m-" + f.id, L,
  // proba finale (modèle + marché) sur le 1N2 ; modèle seul si pas de cotes
  F: f.pf ? { h: f.pf.h, d: f.pf.d, a: f.pf.a } : f.p }))));
MATCHES.sort((a, b) => a.kickoff.localeCompare(b.kickoff));
const bySlug = Object.fromEntries(MATCHES.map(m => [m.slug, m]));

function bar(p, cls = "", labels = true) {
  const seg = (k, v, name) => `<div class="seg ${k}" style="flex:${Math.max(v, 0.001)}" data-tip="${esc(name)} : ${pct(v, 1)}">${labels && v >= 0.12 ? pct(v) : ""}</div>`;
  return `<div class="bar1n2 ${cls}">${seg("h", p.h, p.hn || "Victoire domicile")}${seg("d", p.d, "Match nul")}${seg("a", p.a, p.an || "Victoire extérieur")}</div>`;
}
function formChips(form) {
  return `<div class="form" aria-label="5 derniers matchs, le plus récent à gauche">${form.slice(0, 5).map(m =>
    `<span class="${m.res}" data-tip="${esc(fmtShort(m.date))} · ${m.venue === "D" ? "dom." : "ext."} vs ${esc(m.opp)} : ${m.gf}-${m.ga}">${m.res}</span>`).join("")}</div>`;
}
function leagueOf(code) { return LEAGUES.find(L => L.code === code); }

// ---------- en-tête / pied
function renderChrome() {
  const last = LEAGUES.map(L => L.last_result).sort().pop();
  const upd = DATA.live && DATA.live.updated;
  const parts = [`<span>Résultats intégrés jusqu'au ${esc(fmtShort(last))}</span>`];
  if (MATCHES.length) parts.push(`<span>Prochains matchs : ${esc(fmtDay(MATCHES[0].kickoff))} → ${esc(fmtDay(MATCHES[MATCHES.length - 1].kickoff))}</span>`);
  if (upd) parts.push(`<span>Dernière mise à jour API-Football : ${esc(fmtDay(upd))} à ${fmtTime(upd)}</span>`);
  parts.push(`<span>${LEAGUES.reduce((s, L) => s + L.n_matches, 0).toLocaleString("fr-FR")} matchs analysés depuis 2022</span>`);
  const miss = DATA.missing || [];
  if (miss.length) parts.push(`<span class="missing" tabindex="0" data-tip="${esc("Matchs joués dont le score n'a pas pu être récupéré : " + miss.map(m => `${m.home} – ${m.away} (${fmtShort(m.date)})`).join(", ") + ". Le modèle et le classement les ignorent en attendant.")}">${miss.length} résultat${miss.length > 1 ? "s" : ""} manquant${miss.length > 1 ? "s" : ""}</span>`);
  document.getElementById("datebar").innerHTML = parts.join("");
  document.getElementById("foot").innerHTML =
    `CoteJuste est un outil d'aide à la décision, pas une garantie : les absents et les compositions sont affichés, mais le modèle n'en tient pas compte. ` +
    `Jouer comporte des risques : endettement, isolement, dépendance. Pour être aidé, appelez le 09 74 75 13 13 (appel non surtaxé). Interdit aux mineurs.`;
}

function setTab(name) {
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.tab === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function controls() {
  const opts = [["all", "Toutes"]].concat(LEAGUES.map(L => [L.code, L.name]));
  return `<div class="controls">
    <div class="chips" role="group" aria-label="Championnat">${opts.map(([k, v]) =>
      `<button class="chip" data-league="${k}" aria-pressed="${state.league === k}">${esc(v)}</button>`).join("")}</div>
    <label class="bankroll" for="bankroll">Ma bankroll <input id="bankroll" inputmode="decimal" value="${String(state.bankroll).replace(".", ",")}"> €</label>
  </div>`;
}

// ---------- vue : matchs
function viewMatches() {
  const list = MATCHES.filter(m => state.league === "all" || m.league === state.league);
  if (!list.length) return `
  <section style="display:grid;gap:16px">
    <div class="section-head"><div><h2>Matchs à venir</h2></div></div>
    ${controls()}
    <section class="card"><h3>Pas de match en vue</h3>
      <p class="hint" style="margin:0">Aucun match ${state.league === "all" ? "" : "de ce championnat "}dans les 14 prochains jours (trêve internationale ?). Le site se met à jour tout seul chaque matin.</p>
    </section>
  </section>`;
  const fav = list.slice().sort((a, b) => Math.max(b.F.h, b.F.a) - Math.max(a.F.h, a.F.a))[0];
  const open = list.slice().sort((a, b) => Math.max(a.F.h, a.F.d, a.F.a) - Math.max(b.F.h, b.F.d, b.F.a))[0];
  const favSide = fav.F.h >= fav.F.a ? "h" : "a";
  const tName = (m, s) => s === "h" ? m.home : m.away;
  const withMk = list.filter(m => m.market);
  let third;
  if (withMk.length) {
    const gapOf = m => Math.max(Math.abs(m.p.h - m.market.h), Math.abs(m.p.a - m.market.a));
    const gap = withMk.slice().sort((a, b) => gapOf(b) - gapOf(a))[0];
    const gapSide = Math.abs(gap.p.h - gap.market.h) >= Math.abs(gap.p.a - gap.market.a) ? "h" : "a";
    third = `<a class="hl" href="#${gap.slug}">
        <span class="what">Plus gros désaccord avec les bookmakers</span>
        <span class="teams">${esc(tName(gap, gapSide))}</span>
        <span class="led big">${pct(gap.p[gapSide])} <small style="font-size:18px;color:var(--board-muted)">vs ${pct(gap.market[gapSide])}</small></span>
        <span class="sub">${esc(gap.home)} – ${esc(gap.away)} · à creuser avant de parier</span>
      </a>`;
  } else {
    const goals = list.slice().sort((a, b) => (b.xg.h + b.xg.a) - (a.xg.h + a.xg.a))[0];
    third = `<a class="hl" href="#${goals.slug}">
        <span class="what">Le plus de buts attendus</span>
        <span class="teams">${esc(goals.home)} – ${esc(goals.away)}</span>
        <span class="led big">${n2(goals.xg.h + goals.xg.a)}</span>
        <span class="sub">Les cotes des bookmakers arrivent quand le match est à moins de 48 h</span>
      </a>`;
  }

  const days = {};
  list.forEach(m => (days[dayKey(m.kickoff)] = days[dayKey(m.kickoff)] || []).push(m));

  return `
  ${recosBlock()}
  <section class="board" aria-label="À la une">
    <div class="board-label">À la une · prochaine journée</div>
    <div class="highlights">
      <a class="hl" href="#${fav.slug}">
        <span class="what">Favori le plus solide</span>
        <span class="teams">${esc(tName(fav, favSide))}</span>
        <span class="led big">${pct(fav.F[favSide])}</span>
        <span class="sub">${esc(fav.home)} – ${esc(fav.away)} · cote juste ${odd(fav.F[favSide])}</span>
      </a>
      <a class="hl" href="#${open.slug}">
        <span class="what">Match le plus indécis</span>
        <span class="teams">${esc(open.home)} – ${esc(open.away)}</span>
        <span class="led big">${pct(open.F.h)} · ${pct(open.F.d)} · ${pct(open.F.a)}</span>
        <span class="sub">Aucune issue ne dépasse ${pct(Math.max(open.F.h, open.F.d, open.F.a))}</span>
      </a>
      ${third}
    </div>
  </section>

  <section style="display:grid;gap:16px">
    <div class="section-head">
      <div><h2>Matchs à venir</h2><p>Probabilités calculées par le modèle et cotes justes (1 ÷ probabilité). Une cote de bookmaker au-dessus de la cote juste indique un pari potentiellement rentable.</p></div>
      <div class="legend"><span><i style="background:var(--home)"></i>Victoire domicile</span><span><i style="background:var(--draw)"></i>Nul</span><span><i style="background:var(--away)"></i>Victoire extérieur</span></div>
    </div>
    ${controls()}
    ${Object.keys(days).sort().map(k => `
      <div class="day"><h3>${esc(fmtDay(days[k][0].kickoff))}</h3>
      ${days[k].map(m => `<div class="mwrap">
        <a class="match" href="#${m.slug}" aria-label="${esc(m.home)} contre ${esc(m.away)} : voir l'analyse">
          <div class="time">${m.time_known ? fmtTime(m.kickoff) : "–"}<small><span class="flagtag">${TAG[m.league]}</span>${m.source === "calendrier" ? ` <span class="flagtag" data-tip="Date du calendrier, à confirmer. Horaire exact, cotes et absents arrivent quand le match est à moins de 48 h.">PROV.</span>` : ""}${m.lineups ? ` <span class="flagtag" data-tip="Compositions officielles publiées">XI</span>` : ""}</small></div>
          <div class="team h">${esc(m.home)}<small>${m.L.teams[m.home].rank}e · forme ${m.L.teams[m.home].form_pts}/15</small></div>
          ${bar(Object.assign({}, m.F, { hn: "Victoire " + m.home, an: "Victoire " + m.away }))}
          <div class="team a">${esc(m.away)}<small>${m.L.teams[m.away].rank}e · forme ${m.L.teams[m.away].form_pts}/15</small></div>
          <div class="odds num" data-tip="${m.sans_marche ? "Cotes justes du modèle seul (pas encore de cotes bookmakers)" : "Cotes justes de la proba finale (modèle + marché)"}"><span><b>${odd(m.F.h)}</b>1</span><span><b>${odd(m.F.d)}</b>N</span><span><b>${odd(m.F.a)}</b>2</span></div>
          <span class="chev" aria-hidden="true">›</span>
        </a>
        <div class="pickbar"><span>Ajouter au combiné :</span>${Object.keys(PICKS).map(k => pickBtn(m, k)).join("")}</div></div>`).join("")}
      </div>`).join("")}
  </section>`;
}

// ---------- vue : fiche match
function kelly(p, o) {
  const f = (p * o - 1) / (o - 1);
  return Math.max(0, Math.min(f / 4, 0.05));
}
const POS = { G: "Gardien", D: "Défenseur", M: "Milieu", F: "Attaquant" };
const REASON = { "Injury": "Blessure", "Knee Injury": "Genou", "Muscle Injury": "Blessure musculaire", "Hamstring Injury": "Ischio-jambiers",
  "Ankle Injury": "Cheville", "Foot Injury": "Pied", "Thigh Injury": "Cuisse", "Calf Injury": "Mollet", "Groin Injury": "Adducteurs",
  "Back Injury": "Dos", "Shoulder Injury": "Épaule", "Hip Injury": "Hanche", "Knock": "Coup", "Illness": "Malade", "Suspended": "Suspendu",
  "Red Card": "Carton rouge", "Yellow Cards": "Accumulation de cartons", "Personal Reasons": "Raisons personnelles", "Inactive": "Inactif",
  "Lack of fitness": "Manque de rythme", "Broken Leg": "Fracture de la jambe", "Concussion": "Commotion", "Achilles Tendon Injury": "Tendon d'Achille",
  "Coach's decision": "Choix de l'entraîneur", "Rest": "Repos", "Loan agreement": "Clause de prêt", "Doping Ban": "Suspension (dopage)" };
const stamp = iso => iso ? `${fmtDay(iso)} à ${fmtTime(iso)}` : "";
const ODDS_KEYS = { h: "h", d: "d", a: "a", o25: "o25", u25: "u25" };

function absentsCard(m) {
  const waiting = m.source === "api" ? "Liste pas encore récupérée : elle le sera à la prochaine mise à jour." : "La liste arrive quand le match est à moins de 48 h.";
  const col = (name, lst, color) => `<div class="teamcol"><h4><i style="background:${color}"></i>${esc(name)}</h4>${
    !lst || !lst.length ? `<p class="hint" style="margin:0">Aucun absent signalé.</p>` :
    `<ul class="plist">${lst.map(x => `<li><span>${esc(x.player)} <span class="pos">· ${esc(REASON[x.reason] || x.reason || "")}</span></span>
      ${x.type === "Missing Fixture" ? `<span class="tag out">Absent</span>` : `<span class="tag doubt">Incertain</span>`}</li>`).join("")}</ul>`}</div>`;
  return `<section class="card" aria-labelledby="abs-t">
    <h3 id="abs-t">Absents</h3>
    ${m.absents ? `<div class="grid2" style="grid-template-columns:1fr 1fr">${col(m.home, m.absents.home, "var(--home)")}${col(m.away, m.absents.away, "var(--away)")}</div>
      <p class="stamp" style="margin:0">Source API-Football, relevé le ${esc(stamp(m.checked && m.checked.injuries))}. Le modèle n'en tient pas compte.</p>`
      : `<p class="hint" style="margin:0">${waiting}</p>`}
  </section>`;
}
function lineupsCard(m) {
  const col = (name, t, color) => `<div class="teamcol"><h4><i style="background:${color}"></i>${esc(name)}${t.formation ? ` <small class="pos">${esc(t.formation)}</small>` : ""}</h4>
    ${t.coach ? `<p class="stamp" style="margin:0">Entraîneur : ${esc(t.coach)}</p>` : ""}
    <ul class="plist">${t.xi.map(p => `<li><span><span class="nb">${p.n ?? ""}</span>${esc(p.name)}</span><span class="pos">${esc(POS[p.pos] || "")}</span></li>`).join("")}</ul>
    ${t.subs && t.subs.length ? `<details><summary>Remplaçants (${t.subs.length})</summary><ul class="plist" style="margin-top:8px">${t.subs.map(p => `<li><span><span class="nb">${p.n ?? ""}</span>${esc(p.name)}</span><span class="pos">${esc(POS[p.pos] || "")}</span></li>`).join("")}</ul></details>` : ""}
  </div>`;
  return `<section class="card" aria-labelledby="xi-t">
    <h3 id="xi-t">Compositions</h3>
    ${m.lineups ? `<div class="grid2" style="grid-template-columns:1fr 1fr">${col(m.home, m.lineups.home, "var(--home)")}${col(m.away, m.lineups.away, "var(--away)")}</div>`
      : `<p class="hint" style="margin:0">Pas encore publiées : elles sortent environ 40 minutes avant le coup d'envoi et s'affichent ici dès que le site les récupère.</p>`}
  </section>`;
}

// xG (Understat) d'une équipe : moyenne de la saison et des 5 derniers matchs avec xG, et « chance » = buts − xG
const n1 = x => (Math.round(x * 10) / 10).toFixed(1).replace(".", ",");
const s1 = x => (x > 0 ? "+" : x < 0 ? "−" : "") + n1(Math.abs(x));
function xgBlock(name, t) {
  const X = t.xg || {}, S = X.season, L5 = X.last5;
  if (!S && !L5) return `<p class="stamp" style="margin:0">xG : pas de données Understat pour cette équipe.</p>`;
  if (!S && Date.now() - Date.parse(L5.last + "T12:00:00Z") > 120 * 86400e3)
    return `<p class="stamp" style="margin:0">xG récents indisponibles : Understat est en maintenance et ses copies archivées s'arrêtent au ${esc(fmtShort(L5.last))} pour cette équipe. Le modèle utilise ses buts réels.</p>`;
  const ref = S || L5;
  const lines = [];
  if (ref.n >= 4) {
    if (ref.att_luck >= 3 || ref.att_luck / ref.n >= 0.35) lines.push(`${name} marque plus que ses occasions ne le laissent prévoir (${s1(ref.att_luck)} but${Math.abs(ref.att_luck) >= 2 ? "s" : ""} au-dessus de ses xG) : réussite qui risque de se tasser.`);
    else if (ref.att_luck <= -3 || ref.att_luck / ref.n <= -0.35) lines.push(`${name} marque moins que ses occasions (${s1(ref.att_luck)} sous ses xG) : plutôt malchanceux devant, ça devrait s'améliorer.`);
    if (ref.def_luck >= 3 || ref.def_luck / ref.n >= 0.35) lines.push(`${name} encaisse moins que les occasions adverses (${s1(ref.def_luck)} buts évités) : gardien en forme ou chance.`);
    else if (ref.def_luck <= -3 || ref.def_luck / ref.n <= -0.35) lines.push(`${name} encaisse plus que les occasions adverses (${s1(-ref.def_luck)} buts de trop) : malchanceux derrière.`);
  }
  const luck = ref.att_luck + ref.def_luck;
  const tag = Math.abs(luck) < 2 ? `<span class="tag ok">dans la norme</span>` : luck > 0 ? `<span class="tag doubt">chanceux</span>` : `<span class="tag out">malchanceux</span>`;
  return `<div class="stats" style="margin-top:4px">
      <div><span>xG pour / contre · saison</span><b>${S ? `${n2(S.xgf)} / ${n2(S.xga)}` : "–"}</b></div>
      <div><span>xG pour / contre · 5 derniers</span><b>${L5 ? `${n2(L5.xgf)} / ${n2(L5.xga)}` : "–"}</b></div>
      <div><span>Buts − xG (attaque)</span><b>${s1(ref.att_luck)}</b></div>
      <div><span>xG − buts encaissés (défense)</span><b>${s1(ref.def_luck)}</b></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="stamp">Bilan chance ${S ? "sur la saison" : "sur les 5 derniers matchs avec xG"} :</span>${tag}</div>
    ${lines.map(l => `<p class="hint" style="margin:0">${esc(l)}</p>`).join("")}
    <p class="stamp" style="margin:0">xG Understat par match${S ? ` : ${S.n} match(s) de la saison` : " : aucun de la saison en cours"}${L5 ? `, 5 derniers du ${esc(fmtShort(L5.first))} au ${esc(fmtShort(L5.last))}` : ""}.</p>`;
}

function viewMatch(m) {
  const L = m.L, th = L.teams[m.home], ta = L.teams[m.away];
  const saved = store.get("odds:" + m.slug, {});
  const api = {}, prefOdds = m.odds && m.odds.pref ? m.odds.pref.odds : null;
  if (m.odds && m.odds.median) Object.keys(ODDS_KEYS).forEach(k => { const v = (prefOdds && prefOdds[k]) || m.odds.median[k]; if (v) api[k] = n2(v); });

function updateCalc(slug) {
  const saved = {};
  document.querySelectorAll(".valtable tbody tr").forEach(tr => {
    const p = parseFloat(tr.dataset.p), k = tr.dataset.k;
    const inp = tr.querySelector("input"), o = parseNum(inp.value);
    const v = tr.querySelector(".v"), st = tr.querySelector(".stake");
    const fromApi = inp.dataset.api && inp.value.trim() === inp.dataset.api;
    inp.classList.toggle("api", !!fromApi);
    // on ne mémorise que ce que tu as tapé toi-même : les cotes du marché suivent les mises à jour
    if (!fromApi && (inp.value.trim() !== "" || inp.dataset.api)) saved[k] = inp.value.trim();
    if (!(o > 1)) { v.innerHTML = `<span class="verdict none">—</span>`; st.textContent = ""; return; }
    const val = o * p;
    let cls, label;
    if (val >= 1.05) { cls = "good"; label = "✓ Valeur " + n2(val); }
    else if (val >= 1.0) { cls = "fair"; label = "≈ Juste prix " + n2(val); }
    else { cls = "bad"; label = "✕ Pas de valeur " + n2(val); }
    v.innerHTML = `<span class="verdict ${cls}">${label}</span>`;
    const f = val >= 1.05 ? kelly(p, o) : 0;
    st.textContent = f > 0 ? euro(Math.max(0.1, Math.round(state.bankroll * f * 10) / 10)) : "0 €";
  });
  store.set("odds:" + slug, saved);
}

const LNAME = Object.fromEntries(LEAGUES.map(L => [L.code, L.name]));
const signedEuro = x => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2).replace(".", ",") + " €";
const signedP1 = x => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x * 100).toFixed(1).replace(".", ",") + " %";
const tone = x => x == null || Math.abs(x) < 1e-9 ? "" : x > 0 ? "pos-v" : "neg-v";
const ll3 = x => x == null ? "–" : x.toFixed(3).replace(".", ",");
const fmtKo = iso => new Intl.DateTimeFormat("fr-FR", { timeZone: tz, day: "numeric", month: "short" }).format(new Date(iso));

function niceStep(range) {
  const raw = range / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  return [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
}
function gainsChart(bets) {
  const done = bets.filter(b => b.resultat);
  if (!done.length) return `<p class="hint" style="margin:0">Aucun pari réglé pour l'instant : la courbe apparaîtra après les premiers matchs.</p>`;
  let cum = 0;
  const pts = [{ i: 0, y: 0 }].concat(done.map((b, k) => ({ i: k + 1, y: (cum += b.gain), b })));
  const W = 640, H = 260, P = { l: 52, r: 16, t: 14, b: 34 };
  const ys = pts.map(p => p.y), step = niceStep(Math.max(1, Math.max(...ys, 0) - Math.min(...ys, 0)));
  const y0 = Math.floor(Math.min(...ys, 0) / step) * step, y1 = Math.ceil(Math.max(...ys, 0) / step) * step || step;
  const X = i => P.l + i / Math.max(1, done.length) * (W - P.l - P.r), Y = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);
  const ticks = []; for (let v = y0; v <= y1 + 1e-9; v += step) ticks.push(v);
  const path = pts.map((p, k) => (k ? "L" : "M") + X(p.i).toFixed(1) + "," + Y(p.y).toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return `<div class="chart" id="gchart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gains cumulés : ${signedEuro(last.y)} après ${done.length} paris">
      <g class="grid">${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v.toLocaleString("fr-FR")} €</text>`).join("")}</g>
      <line x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-2)" stroke-width="1"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(last.i)}" cy="${Y(last.y)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${Math.min(X(last.i), W - P.r - 4)}" y="${Y(last.y) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:700;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round">${signedEuro(last.y)}</text>
      <text x="${P.l}" y="${H - 10}">1er pari</text><text x="${W - P.r}" y="${H - 10}" text-anchor="end">${done.length}e pari (ordre chronologique)</text>
      <line id="gx" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-2)" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="gd" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      <rect id="gh" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/>
    </svg></div>`;
  // le survol est branché par setupChart()
}
let CHART_PTS = null;
function setupChart(bets) {
  const svg = document.querySelector("#gchart svg"); if (!svg) return;
  const done = bets.filter(b => b.resultat); let cum = 0;
  CHART_PTS = done.map((b, k) => ({ i: k + 1, y: (cum += b.gain), b }));
  const hit = svg.querySelector("#gh"), gx = svg.querySelector("#gx"), gd = svg.querySelector("#gd");
  const P = { l: 52, r: 16 }, W = 640;
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * W;
    const k = Math.max(1, Math.min(done.length, Math.round((xv - P.l) / (W - P.l - P.r) * done.length)));
    const p = CHART_PTS[k - 1], ref = svg.querySelectorAll("path")[0];
    // position du point : on relit l'échelle à partir du tracé
    const seg = ref.getAttribute("d").split(/[ML]/).filter(Boolean)[k].split(",");
    gx.setAttribute("x1", seg[0]); gx.setAttribute("x2", seg[0]); gx.setAttribute("visibility", "visible");
    gd.setAttribute("cx", seg[0]); gd.setAttribute("cy", seg[1]); gd.setAttribute("visibility", "visible");
    hit.dataset.tip = `Pari n° ${k} · ${fmtKo(p.b.coup_envoi)} · ${p.b.match} · ${p.b.pari} à ${n2(p.b.cote)} : ${p.b.resultat} (${signedEuro(p.b.gain)}) · cumul ${signedEuro(p.y)}`;
  });
  hit.addEventListener("pointerleave", () => { gx.setAttribute("visibility", "hidden"); gd.setAttribute("visibility", "hidden"); });
}

const SERIE_SHORT = { secu: "Sécu", valeur: "Valeur", combine: "Combiné", grosse: "Grosse cote", toutes_modele: "Valeurs · modèle seul", toutes_finale: "Valeurs · proba finale" };
function viewBilan() {
  const B = DATA.bilan;
  const head = `<div class="section-head"><div><h2>Bilan</h2><p>Chaque reco est enregistrée au moment où elle apparaît (<code class="f">data/recos.csv</code>), et chaque relevé de cotes dans <code class="f">data/journal.csv</code>. Voici ce qu'auraient rapporté ces paris, à 1 € par pari, à la cote ${esc(BOOK)} quand l'API la donne, sinon à la cote moyenne.</p></div></div>`;

  const sel = B.series[state.bilanSerie] ? state.bilanSerie : "toutes_finale";
  const V = B.series[sel], s = V.summary, L = B.logloss;
  const chips = `<div class="chips" role="group" aria-label="Série affichée">${Object.keys(SERIE_SHORT).map(k =>
    `<button class="chip" data-bserie="${k}" aria-pressed="${sel === k}">${SERIE_SHORT[k]}</button>`).join("")}</div>`;
  const recent = V.bets.slice().reverse().slice(0, 40);
  const dLL = L.n ? L.final - L.book : null;
  return head + `
  <div class="controls">${chips}<span class="stamp">${B.journal_rows} relevé(s) de cotes sur ${B.matches} match(s) · ${B.recos} reco(s) enregistrée(s)</span></div>
  ${s.small ? `<div class="warn"><b>Échantillon trop petit pour conclure</b> : ${s.settled} pari(s) réglé(s) dans « ${esc(B.labels[sel])} », il en faut au moins ${B.echantillon_min}. Les chiffres ci-dessous peuvent encore changer du tout au tout.</div>` : ""}
  <div class="kpis">
    <div class="kpi"><div class="v num">${s.n}</div><div class="l">Paris · ${esc(B.labels[sel])}</div><div class="c">${s.settled} réglé(s)${s.pending ? `, ${s.pending} en attente` : ""}</div></div>
    <div class="kpi"><div class="v num">${s.hit == null ? "–" : pct(s.hit)}</div><div class="l">Taux de réussite</div><div class="c">${s.won} gagné(s) sur ${s.settled}${s.avg_odds ? ` · cote moyenne ${n2(s.avg_odds)}` : ""}</div></div>
    <div class="kpi"><div class="v num ${tone(s.roi)}">${signedP1(s.roi)}</div><div class="l">ROI (1 € par pari)</div><div class="c">${s.settled ? `${signedEuro(s.profit)} pour ${s.stake.toLocaleString("fr-FR")} € misés` : "aucun pari réglé"}</div></div>
    <div class="kpi"><div class="v num ${tone(s.clv_mean)}">${signedP1(s.clv_mean)}</div><div class="l">CLV moyenne</div><div class="c">${s.clv_n ? `${pct(s.clv_pos)} des paris ont battu la clôture (${s.clv_n} avec cote de clôture)` : "pas encore de cote de clôture"}</div></div>
  </div>
  <section class="card"><h3>Gains cumulés · ${esc(B.labels[sel])}</h3>
    <p class="hint">Chaque pari réglé ajoute (cote prise − 1) € s'il est gagné, retire 1 € s'il est perdu. Survole la courbe pour le détail.</p>
    ${gainsChart(V.bets)}
  </section>
  <section class="card"><h3>Toutes les séries</h3>
    <div class="tablewrap"><table><thead><tr><th>Série</th><th class="r">Paris</th><th class="r">Réglés</th><th class="r">Réussite</th><th class="r">Gain</th><th class="r">ROI</th><th class="r">CLV moy.</th><th></th></tr></thead><tbody>
      ${Object.keys(SERIE_SHORT).map(k => { const g = B.series[k].summary; return `<tr><td><b>${esc(B.labels[k])}</b></td><td class="r num">${g.n}</td><td class="r num">${g.settled}</td>

        <td class="r num ${tone(g.clv_mean)}">${signedP1(g.clv_mean)}</td><td class="stamp">${g.small ? "échantillon trop petit" : ""}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="hint" style="margin:0">« Valeurs » : tous les paris où cote prise × proba ≥ 1,05 au dernier relevé avant le match. Comparer « modèle seul » et « proba finale » montre ce qu'apporte le mélange avec le marché.</p>
  </section>
  <section class="card"><h3>Probabilités contre bookmakers</h3>
