<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probalab</title>
<meta name="description" content="Probalab : probabilités, cotes justes et recos de paris pour la Ligue 1, la Premier League, LaLiga et la Serie A.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Probalab : interface selon design/DESIGN.md (jetons, cartes, 3 mises en page). */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF;
  --ink: #0E1525; --ink-2: #2A3142; --ink-3: #4A5163; --muted: #5F6675;
  --line: #EEF0F4; --line-2: #E6E9F0; --line-3: #F1F3F6; --field: #D9DEE7;
  --accent: #3156F5; --accent-bg: #EDF1FF; --accent-ink: #1F3FBF;
  --home: #2A78D6; --home-ink: #1F5FB8; --home-bg: #E8F0FB;
  --draw: #CDD2DB; --draw-ink: #4A5163;
  --away: #EB6834; --away-ink: #B44A1C; --away-bg: #FDEDE5;
  --good-bg: #E6F5EA; --good: #146C2E; --bad-bg: #FDECEC; --bad: #A32626;
  --warn-bg: #FFF4E0; --warn: #8A5300; --warn-2: #6B4300;
  --value-bg: #FFEFE5; --value-ink: #8A3A00;
  --dark: #0E1525; --dark-2: #B9C0CE; --dark-val: #7BE29A; --dark-bad: #FF9B9B;
  --seq-0: #EEF4FC; --seq-1: #CDE2FB; --seq-2: #9EC5F4; --seq-3: #6DA7EC; --seq-4: #3987E5; --seq-5: #256ABF; --seq-6: #184F95;
  --shadow: 0 1px 2px rgba(14,21,37,.05), 0 8px 24px rgba(14,21,37,.06);
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --side: 240px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.big { font-size: 22px; font-weight: 800; line-height: 1.15; }
.brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.brand span { color: var(--accent); }

/* ---------- ossature */
.side { display: none; }
.page { padding: 20px 18px 128px; min-width: 0; }
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.mtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1160px; margin: 0 auto 18px; }
.bk-pill { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 4px 6px 4px 14px; box-shadow: 0 1px 2px rgba(14,21,37,.06); }
.bk-pill label { font-size: 12px; color: var(--muted); font-weight: 600; }
.bk-pill input, .bk-box input { width: 72px; border: 1.5px solid transparent; border-radius: 999px; padding: 6px 8px; font-weight: 800; text-align: right; background: transparent; min-height: 36px; }
.bk-pill input:hover, .bk-pill input:focus, .bk-box input:hover, .bk-box input:focus { border-color: var(--field); background: var(--surface); }
.tabbar { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 30; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: rgba(255,255,255,.96); border-radius: 22px; padding: 8px; box-shadow: 0 8px 30px rgba(14,21,37,.12); max-width: 560px; margin: 0 auto; }
.tabbar a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 14px; }
.tabbar a[aria-current="page"] { color: var(--accent); font-weight: 700; }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.side .badge { position: static; margin-left: auto; }
.badge[hidden] { display: none; }
footer.foot { max-width: 1160px; margin: 28px auto 0; font-size: 12px; line-height: 1.5; color: var(--muted); }

/* ---------- éléments communs */
.head { display: flex; flex-direction: column; gap: 4px; }
.head p { color: var(--muted); }
.statusline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); font-weight: 600; }
.statusline .miss { color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 2px 10px; cursor: help; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 14px; background: var(--surface); color: var(--ink); min-height: 40px; }
@media (max-width: 420px) { .chip { padding: 10px 13px; } }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }
.pkstrip .chip { background: var(--bg); }
.pkstrip .chip[aria-pressed="true"] { background: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--line-2); border-radius: 14px; padding: 4px; }
.seg > * { border: 0; border-radius: 11px; min-height: 40px; font-weight: 700; font-size: 14px; background: transparent; color: var(--ink-3); display: flex; align-items: center; justify-content: center; }
.seg > [aria-current="page"], .seg > [aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 800; box-shadow: 0 1px 3px rgba(14,21,37,.1); }
.card { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.card h2 { font-size: 18px; }
.card .sub { font-size: 13px; color: var(--muted); }
.ctitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 6px 10px; white-space: nowrap; }
.pill.sm { font-size: 12px; padding: 4px 10px; }
.pill.xs { font-size: 11px; padding: 3px 8px; }
.pill.accent { color: var(--accent-ink); background: var(--accent-bg); }
.pill.value { color: var(--value-ink); background: var(--value-bg); }
.pill.good { color: var(--good); background: var(--good-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.grey { color: var(--ink-3); background: var(--line); }
.pill.ghost { color: #fff; background: rgba(255,255,255,.12); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; min-height: 48px; padding: 0 18px; background: var(--accent); color: #fff; font-weight: 800; font-size: 15px; }
.btn.ghost { background: var(--accent-bg); color: var(--accent-ink); }
.btn.dark { background: rgba(255,255,255,.12); color: #fff; }
.btn.full { width: 100%; }
.btn[aria-pressed="true"] { background: var(--good-bg); color: var(--good); }
.linkbtn { border: 0; background: none; padding: 0; min-height: 32px; color: var(--accent); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 2px; }
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--warn-2); border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45; font-weight: 600; }
.note svg { flex: none; margin-top: 1px; }
.note.err { background: var(--bad-bg); color: var(--bad); }
.note.info { background: var(--accent-bg); color: var(--accent-ink); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile { display: flex; flex-direction: column; gap: 2px; background: var(--bg); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.tile .lbl { font-size: 11px; font-weight: 700; }
.tile b { font-size: 19px; font-weight: 800; }
.tile.warn { background: var(--warn-bg); } .tile.warn .lbl, .tile.warn b { color: var(--warn-2); }
.tile.accent { background: var(--accent-bg); } .tile.accent .lbl, .tile.accent b { color: var(--accent-ink); }
.verdict { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-radius: 16px; padding: 14px 16px; font-weight: 700; font-size: 14px; }
.verdict b { font-size: 16px; font-weight: 800; }
.verdict.good { background: var(--good-bg); color: var(--good); }
.verdict.fair { background: var(--bg); color: var(--ink-2); }
.verdict.bad { background: var(--bad-bg); color: var(--bad); }
.verdict.none { background: var(--bg); color: var(--muted); font-weight: 600; }
.bars { display: flex; gap: 2px; height: 6px; }
.bars > i { display: block; min-width: 2px; }
.bars > i:nth-child(1) { background: var(--home); border-radius: 3px 0 0 3px; }
.bars > i:nth-child(2) { background: var(--draw); }
.bars > i:nth-child(3) { background: var(--away); border-radius: 0 3px 3px 0; }
.bars.lg { height: 8px; gap: 3px; }
.cH { color: var(--home-ink); } .cD { color: var(--draw-ink); } .cA { color: var(--away-ink); }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 6px; background: var(--accent); border-radius: 3px; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--muted); font-weight: 600; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
ul.dots { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
ul.dots li { display: flex; gap: 10px; }
ul.dots li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 8px; }
.tablewrap { overflow-x: auto; position: relative; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line-3); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td b { font-weight: 800; }
.pos-v { color: var(--good); } .neg-v { color: var(--bad); }
.form { display: flex; gap: 3px; }
.form span { width: 18px; height: 20px; border-radius: 5px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.form .V, .fchip.V { background: var(--good-bg); color: var(--good); }
.form .N, .fchip.N { background: var(--line); color: var(--ink-3); }
.form .D, .fchip.D { background: var(--bad-bg); color: var(--bad); }
.fchips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.fchip { display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 12px; padding: 8px 2px; }
.fchip b { font-size: 13px; font-weight: 800; }
.fchip small { font-size: 11px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
details.fold { border-bottom: 1px solid var(--line); }
details.fold:last-child { border-bottom: 0; }
details.fold > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; font-weight: 700; font-size: 15px; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .hint { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-align: right; }
details.fold > summary svg { transition: transform .15s; flex: none; }
details.fold[open] > summary svg { transform: rotate(90deg); }
details.fold > .body { padding: 0 0 16px; display: flex; flex-direction: column; gap: 12px; }
.folds { background: var(--surface); border-radius: 24px; padding: 2px 18px; box-shadow: var(--shadow); }
details.why > summary { list-style: none; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent); min-height: 36px; display: flex; align-items: center; gap: 6px; }
details.why > summary::-webkit-details-marker { display: none; }
details.why[open] > summary svg { transform: rotate(90deg); }
#tip { position: fixed; pointer-events: none; z-index: 60; background: var(--ink); color: #fff; font-size: 13px; padding: 7px 10px; border-radius: 8px; max-width: 280px; opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 70; background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); }

/* ---------- recos */
.recos-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.reco { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.reco.dark { background: var(--dark); color: #fff; box-shadow: 0 8px 24px rgba(14,21,37,.18); }
.reco.dark .lbl, .reco.dark .muted, .reco.dark .small { color: var(--dark-2); }
.reco.fun { border: 2px dashed var(--line-2); }
.reco .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.reco .what { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.reco .what a:hover { text-decoration: underline; text-underline-offset: 3px; }
.reco .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; font-size: 13px; color: var(--muted); }
.reco.dark .foot { border-top-color: rgba(255,255,255,.12); }
.reco .foot b { color: var(--ink); }
.reco.dark .foot b { color: #fff; }
.reco .legs { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; }
.reco .legs > div { display: flex; justify-content: space-between; gap: 10px; }
.reco .legs small { display: block; font-size: 12px; color: var(--dark-2); font-weight: 500; }
.reco .why-body { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.reco.dark ul.dots { color: var(--dark-2); }
.reco .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; }
.reco .kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.reco.dark .kv div { border-bottom-color: rgba(255,255,255,.12); }
.reco .addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.reperes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.repere { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; padding: 12px 14px; min-height: 56px; }
.repere .ico { width: 36px; height: 36px; border-radius: 12px; background: var(--accent-bg); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; }
.repere .t { font-size: 12px; font-weight: 700; color: var(--muted); }
.repere .m { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.repere .v { font-size: 17px; font-weight: 800; text-align: right; white-space: nowrap; }

/* ---------- liste des matchs */
.day { display: flex; flex-direction: column; gap: 10px; }
.day h2 { font-size: 19px; }
.mrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) 128px; gap: 12px; align-items: center; background: var(--surface); border-radius: 18px; padding: 14px 16px; min-height: 72px; }
.mrow:hover { box-shadow: var(--shadow); }
.mrow .time { display: flex; flex-direction: column; font-size: 15px; font-weight: 700; line-height: 1.25; }
.mrow .time small { font-size: 11px; font-weight: 700; color: var(--muted); }
.mrow .teams { display: flex; flex-direction: column; gap: 3px; font-size: 15px; font-weight: 700; min-width: 0; }
.mrow .teams span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .teams .pill { align-self: flex-start; margin-top: 4px; }
.mrow .probs { display: flex; flex-direction: column; gap: 6px; }
.mrow .nums { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.mrow .fair { display: none; font-size: 12px; color: var(--muted); text-align: right; }
.mtable { padding: 8px 0 12px; }
.mtable .hd, .mtable .tr { display: grid; grid-template-columns: 70px minmax(0, 1.6fr) 56px 56px 56px 150px 150px; gap: 12px; align-items: center; padding: 0 24px; }
.mtable .hd { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.mtable .dl { padding: 16px 24px 6px; font-size: 13px; font-weight: 800; }
.mtable .tr { min-height: 58px; border-top: 1px solid var(--line-3); }
.mtable .tr:hover { background: #FAFBFD; }
.mtable .tr .mt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mtable .tr .mt span { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtable .tr .bars { max-width: 260px; height: 5px; }
.mtable .p { text-align: right; font-size: 15px; font-weight: 800; }
.mtable .r { text-align: right; font-size: 13px; color: var(--ink-3); }
.mtable .v { justify-self: end; }
.homegrid { display: flex; flex-direction: column; gap: 22px; }
.homeside { display: none; }

/* ---------- fiche match */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 44px; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: var(--accent); min-height: 44px; }
.mhead { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border-radius: 24px; padding: 20px 18px; box-shadow: var(--shadow); }
.mhead .teamsrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.mhead .tm { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.mhead .tm .nm { font-size: 17px; font-weight: 800; line-height: 1.2; }
.ab { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; flex: none; }
.ab.h { background: var(--home-bg); color: var(--home-ink); } .ab.a { background: var(--away-bg); color: var(--away-ink); }
.mhead .ko { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.mhead .ko b { font-size: 24px; font-weight: 800; }
.mhead .p3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; }
.mhead .p3 b { font-size: 30px; font-weight: 800; line-height: 1.1; }
.mhead .fair3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; font-size: 13px; color: var(--muted); }
.mhead .fair3 b, .mhead .xgl b { color: var(--ink); }
.mhead .xgl { text-align: center; font-size: 13px; color: var(--muted); }
.mhead .mid { display: flex; flex-direction: column; gap: 10px; }
.mhead .pcl { display: none; }
.avis .verdict-line { font-size: 16px; line-height: 1.5; font-weight: 600; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: 12px; color: var(--muted); font-weight: 600; }
.strip b { display: block; color: var(--ink); font-size: 14px; font-weight: 800; }
.cmp { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px 10px; align-items: center; font-size: 13px; color: var(--ink-3); font-weight: 600; }
.tabs7 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tabs7.b2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tabs7 button { border: 0; border-radius: 12px; min-height: 44px; font-weight: 700; font-size: 15px; background: var(--bg); color: var(--ink); padding: 0 6px; }
.tabs7.b2 button { font-size: 14px; }
.tabs7 button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 800; }
.calc-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end; }
.calc-in label { font-size: 12px; font-weight: 700; color: var(--muted); }

<script>
(function () {
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const LEAGUES = DATA.leagues;
const LG_SHORT = { fr1: "L1", en1: "PL", es1: "LIGA", it1: "SA" };
const LG_CHIP = { fr1: "Ligue 1", en1: "Premier L.", es1: "LaLiga", it1: "Serie A" };
// stockage local (préfixe « probalab: », reprise automatique des réglages enregistrés sous l'ancien nom)
const store = {
  get(k, d) {
    try {
      let v = localStorage.getItem("probalab:" + k);
      if (v === null) { const old = localStorage.getItem("cotejuste:" + k); if (old !== null) { localStorage.setItem("probalab:" + k, old); v = old; } }
      return v === null ? d : JSON.parse(v);
    } catch (e) { return d; }
  },
  set(k, v) { try { localStorage.setItem("probalab:" + k, JSON.stringify(v)); } catch (e) {} }
};
const state = {
  league: store.get("league", "all"), bankroll: store.get("bankroll", 15), bilanSerie: store.get("bilanSerie", "toutes_finale"),
  calcPick: "h", standLeague: store.get("standLeague", "fr1"), standView: store.get("standView", "points"),
};

// ---------- utilitaires
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (p, d = 0) => (p * 100).toFixed(d).replace(".", ",") + " %";
const pr0 = p => Math.round(p * 100);
const odd = p => p > 0 ? (1 / p).toFixed(2).replace(".", ",") : "–";
const n2 = x => Number(x).toFixed(2).replace(".", ",");
const n1 = x => (Math.round(x * 10) / 10).toFixed(1).replace(".", ",");
const s1 = x => (x > 0 ? "+" : x < 0 ? "−" : "") + n1(Math.abs(x));
const euro = x => x.toFixed(2).replace(".", ",") + " €";
const signedPct = x => { const r = Math.round(x * 100); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r) + " %"; };
const parseNum = s => { const v = parseFloat(String(s).replace(",", ".")); return isFinite(v) ? v : NaN; };
const tz = "Europe/Paris";
const fmtDay = iso => new Intl.DateTimeFormat("fr-FR", { timeZone: tz, weekday: "long", day: "numeric", month: "long" }).format(new Date(iso));
const fmtDayCap = iso => { const s = fmtDay(iso); return s.charAt(0).toUpperCase() + s.slice(1); };
const fmtTime = iso => new Intl.DateTimeFormat("fr-FR", { timeZone: tz, hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
const fmtWd = iso => new Intl.DateTimeFormat("fr-FR", { timeZone: tz, weekday: "short" }).format(new Date(iso));
const fmtShort = s => new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "2-digit" }).format(new Date(s + "T12:00:00Z"));
const fmtKo = iso => new Intl.DateTimeFormat("fr-FR", { timeZone: tz, day: "numeric", month: "short" }).format(new Date(iso));
const dayKey = iso => new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(new Date(iso));
const stamp = iso => iso ? `${fmtDay(iso)} à ${fmtTime(iso)}` : "";
const isPC = () => window.matchMedia("(min-width: 1100px)").matches;
const abbr = name => name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z ]/g, "").split(" ").filter(Boolean)
  .reduce((s, w, i, a) => a.length > 1 && w.length <= 3 ? s + w[0] : s + w, "").slice(0, 3).toUpperCase();
const REF = DATA.ref_date || new Date().toISOString().slice(0, 10);
const SEASON_START = (+REF.slice(5, 7) >= 7 ? REF.slice(0, 4) : String(+REF.slice(0, 4) - 1)) + "-07-01";
const BOOK = (DATA.config && DATA.config.bookmaker) || "ton bookmaker";
const RK = (DATA.recos && DATA.recos.regles && DATA.recos.regles.kelly) || { fraction: 0.25, plafond: 0.05, mise_min: 0.5, plafond_total: 0.4 };

// icônes (trait, 24 x 24)
const I = (d, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  ball: '<circle cx="12" cy="12" r="9"/><path d="M12 7l3 2-1 4h-4l-1-4z"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
  shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  right: '<path d="M9 6l6 6-6 6"/>', left: '<path d="M15 18l-6-6 6-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', scale: '<path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0z"/>',
};
const chev = I(IC.right, 18, 2.2);

// ---------- matchs
const MATCHES = [];
LEAGUES.forEach(L => L.fixtures.forEach(f => MATCHES.push(Object.assign({}, f, { slug: "m-" + f.id, L,
  F: f.pf ? { h: f.pf.h, d: f.pf.d, a: f.pf.a } : f.p }))));  // proba finale (modèle + marché), modèle seul sans cotes
MATCHES.sort((a, b) => a.kickoff.localeCompare(b.kickoff));
const bySlug = Object.fromEntries(MATCHES.map(m => [m.slug, m]));
const byId = Object.fromEntries(MATCHES.map(m => [m.id, m]));
const leagueOf = code => LEAGUES.find(L => L.code === code);

const KEYS = ["h", "d", "a", "o25", "u25", "by", "bn"];
const TAB = { h: "1", d: "N", a: "2", o25: "+2,5", u25: "−2,5", by: "Les deux marquent", bn: "Pas les deux" };
const pickText = (k, home, away) => ({ h: home + " gagne", d: "Match nul", a: away + " gagne", o25: "Plus de 2,5 buts",
  u25: "Moins de 2,5 buts", by: "Les deux équipes marquent", bn: "Une équipe ne marque pas" })[k];
const pickShort = (k, m) => ({ h: m.home, d: "Nul", a: m.away, o25: "+2,5 buts", u25: "−2,5 buts", by: "Les 2 marquent", bn: "Pas les 2" })[k];
function pFinal(m, k) {
  if (k === "by") return m.markets.btts;
  if (k === "bn") return 1 - m.markets.btts;
  if (m.pf) return m.pf[k];
  return { h: m.p.h, d: m.p.d, a: m.p.a, o25: m.markets.over25, u25: 1 - m.markets.over25 }[k];
}
const pModel = (m, k) => (k === "by" || k === "bn" || !m.pm) ? pFinal(m, k) : m.pm[k];
const pMarket = (m, k) => m.pk && m.pk[k] != null ? m.pk[k] : null;
const bookOdd = (m, k) => (m.odds && m.odds.pref && m.odds.pref.odds && m.odds.pref.odds[k]) || null;
const meanOdd = (m, k) => (m.odds && m.odds.mean && m.odds.mean[k]) || null;
const medOdd = (m, k) => (m.odds && m.odds.median && m.odds.median[k]) || null;
const refOdd = (m, k) => bookOdd(m, k) || meanOdd(m, k);        // cote de référence (comme les recos)
const apiOdd = (m, k) => bookOdd(m, k) || medOdd(m, k);         // pré-remplissage du calculateur
// meilleure « valeur » d'un match à la cote de référence (mêmes seuils que les recos : 1,05 sur le 1N2, 1,08 sur les buts)
function valuePick(m) {
  let best = null;
  ["h", "d", "a", "o25", "u25"].forEach(k => {
    const o = refOdd(m, k);
    if (!o || pMarket(m, k) == null) return;
    const v = o * pFinal(m, k), thr = k.length > 1 ? 1.08 : 1.05;
    if (v >= thr && (!best || v > best.v)) best = { k, o, v, src: bookOdd(m, k) ? BOOK : "moyenne" };
  });
  return best;
}
function kelly(p, o) { const f = (p * o - 1) / (o - 1); return Math.max(0, Math.min(f * RK.fraction, RK.plafond)); }
const stakeFor = f => f > 0 ? Math.max(RK.mise_min, Math.round(state.bankroll * f * 10) / 10) : 0;

// ---------- barres et petits blocs
const bars = (p, cls = "") => `<div class="bars ${cls}" role="img" aria-label="Domicile ${pct(p.h)}, nul ${pct(p.d)}, extérieur ${pct(p.a)}"><i style="flex:${Math.max(p.h, .001)}"></i><i style="flex:${Math.max(p.d, .001)}"></i><i style="flex:${Math.max(p.a, .001)}"></i></div>`;
function formChips(form) {
  return `<div class="form" aria-label="5 derniers matchs, le plus récent à gauche">${form.slice(0, 5).map(m =>
    `<span class="${m.res}" data-tip="${esc(fmtShort(m.date))} · ${m.venue === "D" ? "dom." : "ext."} vs ${esc(m.opp)} : ${m.gf}-${m.ga}">${m.res}</span>`).join("")}</div>`;
}
function statusLine() {
  const last = LEAGUES.map(L => L.last_result).sort().pop();
  const upd = DATA.live && DATA.live.updated;
  const miss = DATA.missing || [];
  const parts = [];
  if (upd) parts.push(`<span>Données du ${esc(fmtDay(upd))} à ${fmtTime(upd)}</span>`);
  parts.push(`<span>Résultats jusqu'au ${esc(fmtShort(last))}</span>`);
  parts.push(`<span>${LEAGUES.reduce((s, L) => s + L.n_matches, 0).toLocaleString("fr-FR")} matchs analysés depuis 2022</span>`);

const RECO_KIND = { secu: ["Pari sécu", "accent", IC.shield], valeur: ["Pari valeur", "value", IC.target], combine: ["Combiné du jour", "ghost", IC.layers], grosse: ["Grosse cote · pour s'amuser", "warn", IC.star] };
function liveRecos() {  // on masque une reco dès qu'un de ses matchs a commencé
  const now = Date.now();

}
// Mises : 1/4 de Kelly (fraction calculée côté Python), min 0,50 €, arrondi à 0,10 €, total <= 40 % de la bankroll.
function recoStakes(items, bankroll) {
  const r1 = x => Math.round(x * 10) / 10, cap = bankroll * RK.plafond_total;
  let st = items.map(it => it.mise_fixe != null ? it.mise_fixe : Math.max(RK.mise_min, r1(bankroll * (it.kelly || 0))));
  const capped = items.map(() => false), sum = () => st.reduce((a, b) => a + b, 0);
  if (sum() > cap + 1e-9) {  // on réduit d'abord les mises Kelly au prorata
    const fixed = items.reduce((s, it, i) => s + (it.mise_fixe != null ? st[i] : 0), 0);
    const kel = sum() - fixed, room = cap - fixed;
    if (room > 0 && kel > 0) st = st.map((s, i) => items[i].mise_fixe != null ? s : Math.max(RK.mise_min, Math.floor(s * room / kel * 10) / 10));
  }
  for (let i = items.length - 1; i >= 0 && sum() > cap + 1e-9; i--) { st[i] = 0; capped[i] = true; }  // puis on retire la grosse cote, le combiné…
  return { stakes: st, capped, total: sum(), cap };
}

// ---------- repères du week-end (bande compacte)
function reperes(list) {
  if (!list.length) return "";
  const fav = list.slice().sort((a, b) => Math.max(b.F.h, b.F.a) - Math.max(a.F.h, a.F.a))[0];
  const open = list.slice().sort((a, b) => Math.max(a.F.h, a.F.d, a.F.a) - Math.max(b.F.h, b.F.d, b.F.a))[0];
  const favSide = fav.F.h >= fav.F.a ? "h" : "a";
  const withMk = list.filter(m => m.market);
  let third;
  if (withMk.length) {
    const gapOf = m => Math.max(Math.abs(m.p.h - m.market.h), Math.abs(m.p.a - m.market.a));
    const g = withMk.slice().sort((a, b) => gapOf(b) - gapOf(a))[0];
    const s = Math.abs(g.p.h - g.market.h) >= Math.abs(g.p.a - g.market.a) ? "h" : "a";
    third = [g, "Plus gros désaccord avec le marché", `${s === "h" ? g.home : g.away} · ${g.home} – ${g.away}`, `${pr0(g.p[s])} % vs ${pr0(g.market[s])} %`, IC.scale,
      "Modèle contre bookmakers (marge retirée) : à creuser avant de parier"];
  } else {
    const g = list.slice().sort((a, b) => (b.xg.h + b.xg.a) - (a.xg.h + a.xg.a))[0];
    third = [g, "Le plus de buts attendus", `${g.home} – ${g.away}`, n2(g.xg.h + g.xg.a), IC.bolt, "Les cotes des bookmakers arrivent quand le match est à moins de 48 h"];
  }
  const items = [
    [fav, "Favori le plus solide", `${favSide === "h" ? fav.home : fav.away} · ${fav.home} – ${fav.away}`, pct(fav.F[favSide]), IC.shield, `Cote juste ${odd(fav.F[favSide])}`],
    [open, "Match le plus indécis", `${open.home} – ${open.away}`, `${pr0(open.F.h)} · ${pr0(open.F.d)} · ${pr0(open.F.a)}`, IC.target, `Aucune issue ne dépasse ${pct(Math.max(open.F.h, open.F.d, open.F.a))}`],
    third,
  ];
  return `<section aria-label="Repères du week-end" class="head" style="gap:10px"><h2 style="font-size:17px">Repères</h2>
    <div class="reperes">${items.map(([m, t, txt, v, ic, tip]) => `<a class="repere" href="#${m.slug}" data-tip="${esc(tip)}">
      <span class="ico">${I(ic, 18)}</span><span style="min-width:0"><span class="t">${esc(t)}</span><span class="m" style="display:block">${esc(txt)}</span></span><span class="v">${esc(v)}</span></a>`).join("")}</div>
  </section>`;
}

let cart = store.get("panier", []);
if (!Array.isArray(cart)) cart = [];
cart = cart.filter(c => c && c.id != null && c.k).map(c => {   // ancien format : odds + src ; nouveau : userOdds (cote tapée à la main)
  if (c.userOdds === undefined) c.userOdds = (c.src === "ta cote" || !byId[c.id]) ? (c.odds || "") : "";
  delete c.odds; delete c.src;
  return c;
});
let cartMsg = null;
const inCart = (id, k) => cart.some(c => c.id === id && c.k === k);
function saveCart() { store.set("panier", cart); }
// Cotes par défaut : Betclic partout si toutes les sélections en ont une, sinon la cote moyenne partout (jamais un mélange).
function cartLines() {
  const lines = cart.map(c => {
    const m = byId[c.id];
    return Object.assign({}, c, { m, p: m ? pFinal(m, c.k) : c.pModel, pk: m ? pMarket(m, c.k) : c.pMkt, user: parseNum(c.userOdds) });
  });
  const need = lines.filter(l => !(l.user > 1) && l.m && (bookOdd(l.m, l.k) || meanOdd(l.m, l.k)));
  const base = need.length && need.every(l => bookOdd(l.m, l.k)) ? "bookmaker" : "moyenne";
  lines.forEach(l => {
    l.def = l.m ? (base === "bookmaker" ? bookOdd(l.m, l.k) : meanOdd(l.m, l.k)) : null;
    l.o = l.user > 1 ? l.user : l.def;
    l.src = l.user > 1 ? "ta cote" : l.def ? (base === "bookmaker" ? `cote ${BOOK}` : "cote moyenne") : "cote à saisir";
  });
  return { lines, base };
}
function cartTotals() {
  const { lines, base } = cartLines(), prod = a => a.reduce((x, y) => x * y, 1);
  const allOdds = lines.length && lines.every(l => l.o > 1), allMkt = lines.length && lines.every(l => l.pk != null);
  const odds = allOdds ? prod(lines.map(l => l.o)) : null, pm = lines.length ? prod(lines.map(l => l.p)) : null;
  const pk = allMkt ? prod(lines.map(l => l.pk)) : null;
  const stake = parseNum(store.get("cartStake", "2")) || 0;
  return { L: lines, base, odds, pm, pk, value: odds && pm ? odds * pm : null, mktValue: odds && pk ? odds * pk : null, stake };
}
function toast(msg) {

  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

function togglePick(slug, k) {
  const m = bySlug[slug]; if (!m) return;
  const idx = cart.findIndex(c => c.id === m.id);
  cartMsg = null;
  if (idx >= 0 && cart[idx].k === k) { cart.splice(idx, 1); toast("Retiré du combiné"); }
  else if (idx >= 0) {
    cartMsg = { err: true, text: `Une seule sélection par match : « ${pickText(cart[idx].k, m.home, m.away)} » est déjà dans le combiné pour ${m.home} – ${m.away}. Retire-la d'abord.` };
    toast("Une seule sélection par match");
  } else {
    cart.push({ id: m.id, slug, league: m.league, home: m.home, away: m.away, kickoff: m.kickoff, k, userOdds: "", pModel: pFinal(m, k), pMkt: pMarket(m, k) });
    toast(`Ajouté : ${pickText(k, m.home, m.away)}${cart.length >= 3 ? ` · ${cart.length} sélections` : ""}`);
  }

}
function addReco(i) {
  const it = liveRecos()[i]; if (!it) return;
  cartMsg = null;
  const blocked = []; let added = 0;
  it.legs.forEach(l => {
    const m = byId[l.id]; if (!m) return;
    const cur = cart.find(c => c.id === m.id);
    if (cur && cur.k === l.k) return;
    if (cur) { blocked.push(`${m.home} – ${m.away} (déjà « ${pickText(cur.k, m.home, m.away)} »)`); return; }
    cart.push({ id: m.id, slug: m.slug, league: m.league, home: m.home, away: m.away, kickoff: m.kickoff, k: l.k, userOdds: "", pModel: pFinal(m, l.k), pMkt: pMarket(m, l.k) });
    added++;
  });
  if (blocked.length) cartMsg = { err: true, text: `Une seule sélection par match : non ajouté pour ${blocked.join(", ")}.` };
  toast(blocked.length ? "Une seule sélection par match" : added ? "Ajouté au combiné" : "Déjà dans le combiné");

}

  }

}

// bilan
const signedEuro = x => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2).replace(".", ",") + " €";
const signedP1 = x => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x * 100).toFixed(1).replace(".", ",") + " %";
const tone = x => x == null || Math.abs(x) < 1e-9 ? "" : x > 0 ? "pos-v" : "neg-v";
const ll3 = x => x == null ? "–" : x.toFixed(3).replace(".", ",");
function niceStep(range) {
  const raw = range / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  return [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
}
function gainsChart(bets) {
  const done = bets.filter(b => b.resultat);
  if (!done.length) return `<p class="small muted">Aucun pari réglé pour l'instant : la courbe apparaîtra après les premiers matchs.</p>`;
  let cum = 0;
  const pts = [{ i: 0, y: 0 }].concat(done.map((b, k) => ({ i: k + 1, y: (cum += b.gain), b })));
  const W = 640, H = 260, P = { l: 52, r: 16, t: 14, b: 34 };
  const ys = pts.map(p => p.y), step = niceStep(Math.max(1, Math.max(...ys, 0) - Math.min(...ys, 0)));
  const y0 = Math.floor(Math.min(...ys, 0) / step) * step, y1 = Math.ceil(Math.max(...ys, 0) / step) * step || step;
  const X = i => P.l + i / Math.max(1, done.length) * (W - P.l - P.r), Y = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);
  const ticks = []; for (let v = y0; v <= y1 + 1e-9; v += step) ticks.push(v);
  const path = pts.map((p, k) => (k ? "L" : "M") + X(p.i).toFixed(1) + "," + Y(p.y).toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return `<div class="chart" id="gchart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gains cumulés : ${signedEuro(last.y)} après ${done.length} paris">
      <g class="grid">${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v.toLocaleString("fr-FR")} €</text>`).join("")}</g>
      <line x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-3)" stroke-width="1"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

function setupChart(bets) {
  const svg = document.querySelector("#gchart svg"); if (!svg) return;

  const P = { l: 52, r: 16 }, W = 640;
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * W;

    gd.setAttribute("cx", seg[0]); gd.setAttribute("cy", seg[1]); gd.setAttribute("visibility", "visible");

// méthode
function xgMethod() {
  const X = DATA.xg || {}, C = X.comparison;
  if (!C) return "";
  const o = C.old, nw = C.new, f3 = x => x.toFixed(3).replace(".", ","), f4 = x => x.toFixed(4).replace(".", ","), fr = s => s.replace(/(\d)\.(\d)/g, "$1,$2");

  const cov = C.xg_coverage || {}, seasons = ["2022-23", "2023-24", "2024-25", "2025-26", "2026-27"];
  return `<section class="card"><h2>xG : buts attendus</h2>
    <div class="prose">
      <p>Les xG mesurent la qualité des occasions : un tir de 6 mètres face au but vaut environ 0,4 but attendu, une frappe lointaine 0,03. Ils prédisent mieux l'avenir que les buts, qui contiennent beaucoup de chance. Le modèle estime l'attaque et la défense de chaque équipe sur un mélange : <code class="f">buts utilisés = a × xG + (1 − a) × buts réels</code>. La correction des petits scores (rho) reste calculée sur les vrais scores.</p>
      <p>Valeur de <b>a</b> choisie par le backtest (réglage sur 2024-25, test sur 2025-26 et 2026-27) parmi 0 ; 0,3 ; 0,5 ; 0,7 ; 1 : <b>${String(nw.params.a).replace(".", ",")}</b>. ${C.adopted
        ? (nw.logloss < o.logloss
          ? `Le modèle avec xG fait mieux hors échantillon : il est <b>adopté</b> (a = ${String(X.a).replace(".", ",")}). Le gain reste modeste (log loss ${f4(o.logloss)} → ${f4(nw.logloss)}) et vient des ligues dont les xG récents sont les plus complets ; il devrait grandir quand Understat reviendra.`
          : `Le modèle avec xG est <b>gardé</b> (a = ${String(X.a).replace(".", ",")}). Sur 2024-25, dernière saison aux xG complets, il fait nettement mieux (log loss ${f4(C.tuning_2024_25["0.0"].logloss)} sans xG, ${f4(Object.entries(C.tuning_2024_25).find(([k]) => Number(k) === Number(nw.params.a))[1].logloss)} avec). Hors échantillon, il fait à peine moins bien (${f4(o.logloss)} contre ${f4(nw.logloss)}) : un écart dans le bruit, sur une période où les xG de 2025-26 manquent en grande partie. La comparaison sera refaite quand Understat reviendra.`)
        : `Le modèle avec xG ne fait <b>pas</b> mieux que le modèle avec les buts seuls : <b>il n'est pas adopté</b>, le site garde l'ancien modèle (a = 0).`}</p>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Hors échantillon (${o.n.toLocaleString("fr-FR")} matchs)</th><th class="r">Ancien : buts seuls</th><th class="r">Nouveau : avec xG</th></tr></thead><tbody>
      <tr><td>Réglages</td><td class="r">${fr(`a = 0 · xi ${o.params.xi} · l2 ${o.params.l2}`)}</td><td class="r">${fr(`a = ${nw.params.a} · xi ${nw.params.xi} · l2 ${nw.params.l2}`)}</td></tr>
      <tr><td>Log loss 1N2 (plus bas = mieux)</td><td class="r ${better(o.logloss, nw.logloss)}">${f4(o.logloss)}</td><td class="r ${better(nw.logloss, o.logloss)}"><b>${f4(nw.logloss)}</b></td></tr>
      <tr><td>RPS</td><td class="r ${better(o.rps, nw.rps)}">${f3(o.rps)}</td><td class="r ${better(nw.rps, o.rps)}">${f3(nw.rps)}</td></tr>
      <tr><td>Bon favori</td><td class="r">${pct(o.accuracy, 1)}</td><td class="r">${pct(nw.accuracy, 1)}</td></tr>
      <tr><td>Brier +/− 2,5 buts (moyenne historique : ${f4(o.over25_base)})</td><td class="r ${better(o.over25_brier, nw.over25_brier)}">${f4(o.over25_brier)}</td><td class="r ${better(nw.over25_brier, o.over25_brier)}">${f4(nw.over25_brier)}</td></tr>
      ${Object.keys(o.leagues).map(lg => Object.keys(o.leagues[lg]).map(s => `<tr><td>${NAMES[lg]} ${s} (log loss)</td><td class="r ${better(o.leagues[lg][s], nw.leagues[lg][s])}">${f4(o.leagues[lg][s])}</td><td class="r ${better(nw.leagues[lg][s], o.leagues[lg][s])}">${f4(nw.leagues[lg][s])}</td></tr>`).join("")).join("")}
    </tbody></table></div>
    <p class="small muted">Couverture xG (matchs avec xG / matchs joués). Understat est en maintenance depuis novembre 2026. Saisons passées : ses copies archivées sur archive.org, complétées par les tirs Understat republiés par le projet ouvert worldfootballR (à jour au 18/09/2025) ; la Ligue 1, LaLiga et la Serie A manquent donc pour l'essentiel de 2025-26 (pour la Serie A, archive.org n'a aucune copie utile). Saison en cours : en relais, les xG de football-data.co.uk, un autre fournisseur, vérifiés le 24/11/2026 (mêmes scores que les nôtres sur 458 matchs, xG corrélés à 0,95 avec Understat mais environ 10 % plus bas). Les deux sources ne sont jamais mélangées dans une saison : dès qu'Understat revient, il reprend la saison entière. Sans xG, un match compte avec ses buts réels.</p>
    <div class="tablewrap"><table><thead><tr><th>Championnat</th>${seasons.map(s => `<th class="r">${s}</th>`).join("")}</tr></thead><tbody>
      ${Object.keys(cov).map(lg => `<tr><td>${NAMES[lg]}</td>${seasons.map(s => { const c = cov[lg][s]; return `<td class="r">${c ? `${c.xg}/${c.n}` : "–"}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div>
  </section>`;
}

    <section class="card"><h2>Des probabilités fiables ?</h2><p class="small muted">Quand le modèle dit 40 %, l'événement doit arriver environ 4 fois sur 10. Plus les points collent à la diagonale, plus on peut se fier aux cotes justes.</p>${svg}</section>

  </div>

  <section class="card"><h2>Comment ça marche</h2><div class="prose">
    <p><b>1. Les données.</b> Tous les résultats de Ligue 1, Premier League, LaLiga et Serie A depuis août 2022, saison en cours comprise (vérifiée équipe par équipe contre le classement officiel ; pour la Serie A, recoupée entre football-data.co.uk et openfootball).</p>
    <p><b>2. Le modèle de Dixon-Coles.</b> Chaque équipe reçoit une note d'attaque et une note de défense. Les buts attendus d'un match se calculent ainsi : <code class="f">buts domicile = moyenne × avantage domicile × attaque(dom) × défense(ext)</code>. Le nombre de buts suit ensuite une loi de Poisson, avec une correction pour les petits scores (0-0, 1-0, 0-1, 1-1).</p>
    <p><b>3. Les matchs récents comptent plus.</b> Un match pèse <code class="f">exp(−${DATA.model.xi} × jours écoulés)</code>. Les équipes promues partent d'un niveau un peu inférieur à la moyenne, puis le modèle s'ajuste à leurs résultats.</p>
    <p><b>4. Des probabilités aux cotes.</b> <code class="f">cote juste = 1 / probabilité</code> et <code class="f">valeur = cote du bookmaker × probabilité</code>. Mise conseillée : <code class="f">Kelly = (cote × p − 1) / (cote − 1)</code>, divisé par 4 et plafonné à 5 % de la bankroll.</p>
    <p><b>5. Les données du jour.</b> Chaque matin, une tâche automatique interroge API-Football : résultats de la veille, horaires exacts, cotes de plusieurs bookmakers (1N2 et +/− 2,5 buts) et absents des matchs des 48 h à venir. Les compositions sont récupérées dans l'heure qui précède le coup d'envoi. Au-delà de 48 h, les matchs viennent du calendrier officiel (date provisoire).</p>
    <p><b>6. Modèle + marché.</b> La probabilité du marché se lit dans la cote moyenne des bookmakers, une fois leur marge retirée : <code class="f">p_marché = (1/cote) ÷ somme des (1/cote)</code>, sur les 3 issues du 1N2 et sur les 2 issues de +/− 2,5 buts. La <b>proba finale</b> = <code class="f">${String(DATA.config.w).replace(".", ",")} × modèle + ${String(Math.round((1 - DATA.config.w) * 100) / 100).replace(".", ",")} × marché</code>. Sans cotes, c'est le modèle seul (« sans marché ») et aucune reco n'est possible. ${(() => { const Wb = DATA.bilan && DATA.bilan.w; if (!Wb) return ""; return Wb.best == null ? `Le poids idéal sera estimé quand ${Wb.needed} matchs auront une cote de clôture (${Wb.n} pour l'instant).` : `Sur ${Wb.n} matchs, le poids qui aurait minimisé le log loss est <b>${String(Wb.best).replace(".", ",")}</b> (log loss ${ll3(Wb.ll_best)} contre ${ll3(Wb.ll_current)} avec le réglage actuel). Il n'est pas appliqué automatiquement : à changer à la main dans engine/config.py si l'écart se confirme.`; })()}</p>
    <p><b>7. Recos du jour.</b> Candidats : 1, N, 2, +2,5 et −2,5 des matchs à moins de 48 h, pas encore commencés, avec cotes ; cote de référence = cote ${esc(BOOK)} si l'API la fournit pour ce match et ce pari, sinon la cote moyenne ; valeur = cote de référence × proba finale (la meilleure cote n'est affichée qu'à titre indicatif).
      <b>Sécu</b> : proba ≥ 65 %, cote ≥ 1,30, valeur ≥ 1 (on garde la plus haute proba ; cote minimale = 1 ÷ proba).
      <b>Valeur</b> : valeur ≥ 1,05 sur le 1N2 et ≥ 1,08 sur les buts (le modèle y est moins fiable), proba ≥ 35 % (on garde la plus haute valeur ; cote minimale = 1,05 ÷ proba).
      <b>Combiné</b> : 2 ou 3 matchs différents, chaque proba ≥ 55 %, chance combinée ≥ 30 % et valeur combinée ≥ 1.
      <b>Grosse cote</b> : cote ≥ 5 et valeur ≥ 1, mise fixe d'1 €, pour s'amuser.
      Mise : ¼ de Kelly <code class="f">(cote × p − 1) ÷ (cote − 1)</code> sur la cote de référence, plafonnée à 5 % de la bankroll, minimum 0,50 €, arrondie à 0,10 € ; total des mises ≤ 40 % de la bankroll. Confiance élevée quand modèle et marché sont d'accord à 5 points près et que les absents sont connus. Si rien ne passe les filtres, il n'y a pas de reco : on n'en force jamais.</p>
    <p><b>Les limites, honnêtement.</b> Le modèle ne voit que les scores : les absents et les compositions sont affichés mais pas intégrés au calcul, pas plus que la fatigue des Coupes d'Europe. ${DATA.xg && DATA.xg.a > 0 ? "Les xG ne couvrent pas toutes les saisons récentes (Understat en maintenance, copies d'archive incomplètes pour 2025-26) : là où ils manquent, le modèle reprend les buts réels. Cette saison, ils viennent de football-data.co.uk, un autre fournisseur qu'Understat." : "Les xG Understat sont récupérés et affichés, mais n'ont pas amélioré le backtest : le calcul reste sur les buts réels."} Les recos, leurs mises et le Bilan utilisent exactement la même cote de référence (${esc(BOOK)} si l'API la donne, sinon la moyenne ; pour un combiné, ${esc(BOOK)} seulement si toutes les sélections en ont une). Si ta cote réelle est plus basse que la cote minimale affichée, renonce. Le modèle bat nettement un pronostic naïf, mais les bookmakers font en général un peu mieux (log loss ≈ 0,97 contre ${o.model.logloss.toFixed(2).replace(".", ",")} ici). Sur le nombre de buts (+/− 2,5), ${bt.over25.base_brier - bt.over25.brier > 0.002 ? "il fait un peu mieux que la moyenne historique" : "il n'apporte quasiment rien"} (Brier ${bt.over25.brier.toFixed(4).replace(".", ",")} contre ${bt.over25.base_brier.toFixed(4).replace(".", ",")} pour la moyenne). Une « valeur » affichée est donc une piste à vérifier, pas un pari sûr.</p>
    <p><b>Prochaines étapes.</b> Tenir compte des absents dans le calcul ; compléter les xG des saisons récentes quand Understat reviendra ; Bundesliga (le quota gratuit ne permet pas une 5e ligue) ; ajuster le poids modèle/marché quand le Bilan aura assez de matchs.</p>
  </div></section>`;
}

// ---------- routage
let currentName = "accueil";
function route(keepScroll) {
  const h = (location.hash || "#accueil").slice(1) || "accueil";
  const app = document.getElementById("app");
  let name = "accueil", title = "Probalab";
  if (h.startsWith("m-") && bySlug[h]) {
    const m = bySlug[h]; name = "match"; title = `${m.home} – ${m.away} · Probalab`;
    app.innerHTML = viewMatch(m); updateCalc(m);
  } else if (h === "matchs") { name = "matchs"; title = "Matchs · Probalab"; app.innerHTML = viewMatches(); }
  else if (h === "combine") { name = "combine"; title = "Mon combiné · Probalab"; app.innerHTML = viewCombine(); }
  else if (h === "classements" || h === "stats") { name = "classements"; title = "Classement · Probalab"; app.innerHTML = viewStandings(); }
  else if (h === "bilan") { name = "bilan"; title = "Bilan · Probalab"; app.innerHTML = viewBilan(); const B = DATA.bilan; if (B && B.series) setupChart((B.series[state.bilanSerie] || B.series.toutes_finale).bets); }
  else if (h === "methode") { name = "methode"; title = "Méthode · Probalab"; app.innerHTML = viewMethod(); }
  else app.innerHTML = viewHome();
  currentName = name;
  document.title = title;
  renderNav(name === "match" ? "matchs" : name);
  syncBankroll();
  if (!keepScroll) window.scrollTo(0, 0);
}

// ---------- événements
document.addEventListener("click", e => {
  const t = e.target;
  const pk = t.closest("[data-pick]");
  if (pk) { e.preventDefault(); const [s, k] = pk.dataset.pick.split("|"); togglePick(s, k); return; }
  const ar = t.closest("[data-addreco]");
  if (ar) { addReco(+ar.dataset.addreco); return; }
  const pr = t.closest("[data-picker]");
  if (pr) { const strip = document.getElementById("pk-" + pr.dataset.picker); if (strip) { strip.hidden = !strip.hidden; pr.setAttribute("aria-expanded", String(!strip.hidden)); } return; }
  const rm = t.closest("[data-cart-rm]");
  if (rm) { cart.splice(+rm.dataset.cartRm, 1); cartMsg = null; toast("Retiré du combiné"); cartChanged(); return; }
  const sk = t.closest("[data-stake]");
  if (sk) { store.set("cartStake", sk.dataset.stake); route(true); return; }
  const ca = t.closest("[data-calc]");
  if (ca) {  // on ne redessine que le calculateur et le bouton « Ajouter » (les sections dépliées restent ouvertes)
    state.calcPick = ca.dataset.calc;
    const m = bySlug[(location.hash || "").slice(1)];
    if (m) {
      const card = document.getElementById("calc-card"); if (card) { card.outerHTML = calcCard(m); updateCalc(m); }
      const fb = document.getElementById("fab-add");
      if (fb) { fb.dataset.pick = `${m.slug}|${state.calcPick}`; fb.innerHTML = `${I(IC.plus, 20, 2.4)}Ajouter « ${esc(TAB[state.calcPick])} » au combiné`; fb.setAttribute("aria-pressed", String(inCart(m.id, state.calcPick))); }
      const tb = document.getElementById("top-add");
      if (tb) { tb.dataset.pick = `${m.slug}|${state.calcPick}`; tb.innerHTML = `${I(IC.plus, 18, 2.4)}Ajouter « ${esc(pickText(state.calcPick, m.home, m.away))} » au combiné`; tb.setAttribute("aria-pressed", String(inCart(m.id, state.calcPick))); }
      const nc = document.querySelector('[data-calc="' + state.calcPick + '"]'); if (nc) nc.focus();
    }
    return;
  }
  if (t.closest("#cart-clear")) { cart = []; cartMsg = null; toast("Combiné vidé"); cartChanged(); return; }
  if (t.closest("#cart-copy")) { copyCart(); return; }
  if (t.closest("#reset-odds")) {
    const inp = document.getElementById("calc-odds"), m = bySlug[(location.hash || "").slice(1)];
    if (inp && m) { inp.value = inp.dataset.api || ""; updateCalc(m); }
    return;
  }
  const bs = t.closest("[data-bserie]");
  if (bs) { state.bilanSerie = bs.dataset.bserie; store.set("bilanSerie", state.bilanSerie); route(true); return; }
  const st = t.closest("[data-stand]");
  if (st) { state.standLeague = st.dataset.stand; store.set("standLeague", state.standLeague); route(true); return; }
  const sv = t.closest("[data-sview]");
  if (sv) { state.standView = sv.dataset.sview; store.set("standView", state.standView); route(true); return; }
  const lg = t.closest("[data-league]");
  if (lg) { state.league = lg.dataset.league; store.set("league", state.league); route(true); return; }
  const row = t.closest("[data-href]");
  if (row && !t.closest("a,button,input")) { location.hash = row.dataset.href; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.classList.contains("bk-input")) {
    const v = parseNum(t.value);
    if (v > 0) { state.bankroll = v; store.set("bankroll", v); document.querySelectorAll(".bk-input").forEach(i => { if (i !== t) i.value = t.value; }); }
  }
  if (t.id === "calc-odds") { const m = bySlug[(location.hash || "").slice(1)]; if (m) updateCalc(m); }
  if (t.classList.contains("leg-odds")) {
    const c = cart[+t.dataset.i]; if (!c) return;
    c.userOdds = t.value.trim() === t.dataset.def ? "" : t.value.trim();
    saveCart(); updateCartTotals();
  }
  if (t.id === "stake-other") { const v = parseNum(t.value); if (v > 0) { store.set("cartStake", String(v).replace(".", ",")); document.querySelectorAll("[data-stake]").forEach(b => b.setAttribute("aria-pressed", "false")); updateCartTotals(); } }
});
document.addEventListener("change", e => {  // bankroll ou cotes modifiées : on recalcule les vues qui en dépendent
  if (e.target.classList.contains("bk-input")) { if (["accueil", "match"].includes(currentName)) route(true); }
  if (e.target.classList.contains("leg-odds") && currentName === "combine") route(true);
});
// infobulles
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.classList.remove("on"); return; }
  tip.textContent = t.getAttribute("data-tip");
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = (y + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : y) + "px";
  tip.classList.add("on");
});
document.addEventListener("pointerleave", () => tip.classList.remove("on"));
window.addEventListener("hashchange", () => route(false));
window.matchMedia("(min-width: 1100px)").addEventListener("change", () => route(true));  // passage mobile <-> PC : autre mise en page
document.getElementById("foot").innerHTML =
  `Probalab est un outil d'aide à la décision, pas une garantie : les absents et les compositions sont affichés, mais le modèle n'en tient pas compte. ` +
  `Jouer comporte des risques : endettement, isolement, dépendance. Pour être aidé, appelez le 09 74 75 13 13 (appel non surtaxé). Interdit aux mineurs.`;
route(false);
})();
</script>
