      <tr><td>Au moment du relevé</td><td class="r num">${L.n}</td><td class="r num">${ll3(L.model)}</td><td class="r num"><b>${ll3(L.final)}</b></td><td class="r num">${ll3(L.book)}</td></tr>
      <tr><td>Contre la clôture</td><td class="r num">${L.n_close}</td><td class="r num">${ll3(L.model_close)}</td><td class="r num"><b>${ll3(L.final_close)}</b></td><td class="r num">${ll3(L.close)}</td></tr>
    </tbody></table></div>
    <p class="hint" style="margin:0">${!L.n ? "La comparaison démarre après les premiers matchs suivis." : `${dLL < 0 ? "La proba finale a fait mieux que le marché" : "Le marché a fait mieux que la proba finale"} (écart de ${Math.abs(dLL).toFixed(3).replace(".", ",")}). ${L.n < 100 ? "Moins de 100 matchs : l'écart peut encore être dû au hasard." : ""}`}</p>
  </section>
  <section class="card"><h3>Derniers paris · ${esc(B.labels[sel])}</h3>
    ${recent.length ? `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Match</th><th>Pari</th><th class="r">Proba</th><th class="r">Cote prise</th><th class="r">Clôture</th><th class="r">CLV</th><th>Résultat</th><th class="r">Gain</th></tr></thead><tbody>
      ${recent.map(b => `<tr><td class="num" style="white-space:nowrap">${esc(fmtKo(b.coup_envoi))}</td><td>${esc(b.match)}${b.score ? ` <small class="pos">${esc(b.score)}</small>` : ""}</td><td>${esc(b.pari)}</td>
        <td class="r num">${pct(b.proba)}</td><td class="r num" data-tip="${b.base === "bookmaker" ? "Cote " + esc(BOOK) : b.base === "moyenne" ? "Cote moyenne des bookmakers" : "Cotes mixtes"}">${n2(b.cote)}${b.base === "bookmaker" ? " <small class='pos'>" + esc(BOOK) + "</small>" : ""}</td>
        <td class="r num">${b.cloture ? n2(b.cloture) : "–"}</td><td class="r num ${tone(b.clv)}">${signedP1(b.clv)}</td>
        <td>${b.resultat ? `<span class="res ${b.resultat === "gagné" ? "won" : "lost"}">${b.resultat === "gagné" ? "✓ gagné" : "✕ perdu"}</span>` : `<span class="res wait">en attente</span>`}</td>
        <td class="r num ${tone(b.gain)}">${b.gain == null ? "" : signedEuro(b.gain)}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="hint" style="margin:0">Aucun pari dans cette série pour l'instant.</p>`}
  </section>
  <section class="card"><h3>Comment lire ce bilan</h3><div class="prose">
    <p><b>Taux de réussite</b> : part des paris gagnés. Seul, il ne veut rien dire : 70 % de réussite à 1,30 de cote fait perdre de l'argent.</p>
    <p><b>ROI</b> = gain net ÷ somme misée. +5 % veut dire 5 centimes gagnés par euro misé. Sur moins de quelques centaines de paris, il dépend surtout de la chance.</p>
    <p><b>CLV</b> (closing line value) = cote prise ÷ cote de clôture − 1, en comparant toujours deux cotes du même type (${esc(BOOK)} contre ${esc(BOOK)}, moyenne contre moyenne). Positive, tu as eu une meilleure cote que le marché juste avant le match : c'est le signe le plus fiable qu'un pari avait de la valeur.</p>
    <p><b>Log loss</b> : la qualité des probabilités, pari ou pas. Si la proba finale reste au-dessus du marché, ses « valeurs » sont surtout des erreurs, pas des occasions.</p>
    <p><b>Méthode.</b> Les recos sont jugées à la cote prise (${esc(BOOK)} si l'API la donne pour ce match, sinon la cote moyenne), pas à la meilleure cote affichée. Un combiné n'est gagné que si toutes ses sélections passent. Détail pari par pari : <code class="f">data/paris.csv</code>.</p>
  </div></section>`;
}

// ---------- méthode : xG
function xgMethod() {
  const X = DATA.xg || {}, C = X.comparison;
  if (!C) return "";
  const o = C.old, nw = C.new, f3 = x => x.toFixed(3).replace(".", ","), f4 = x => x.toFixed(4).replace(".", ","), fr = s => s.replace(/(\d)\.(\d)/g, "$1,$2");
  const better = (a, b) => a < b ? "pos-v" : a > b ? "neg-v" : "";
  const NAMES = { fr1: "Ligue 1", en1: "Premier League", es1: "LaLiga" };
  const cov = C.xg_coverage || {};
  const seasons = ["2022-23", "2023-24", "2024-25", "2025-26", "2026-27"];
  return `<section class="card"><h3>xG : buts attendus (Understat)</h3>
    <div class="prose">
      <p>Les xG mesurent la qualité des occasions : un tir de 6 mètres face au but vaut environ 0,4 but attendu, une frappe lointaine 0,03. Ils prédisent mieux l'avenir que les buts, qui contiennent beaucoup de chance. Le modèle estime l'attaque et la défense de chaque équipe sur un mélange : <code class="f">buts utilisés = a × xG + (1 − a) × buts réels</code>. La correction des petits scores (rho) reste calculée sur les vrais scores.</p>
      <p>Valeur de <b>a</b> choisie par le backtest (réglage sur 2024-25, test sur 2025-26 et 2026-27) parmi 0 ; 0,3 ; 0,5 ; 0,7 ; 1 : <b>${String(nw.params.a).replace(".", ",")}</b>. ${C.adopted
        ? `Le modèle avec xG fait mieux hors échantillon : il est <b>adopté</b> (a = ${String(X.a).replace(".", ",")}). Le gain est faible (log loss ${f4(o.logloss)} → ${f4(nw.logloss)}) et vient surtout de la Premier League, la seule ligue où les xG récents sont complets : il pourrait encore être dû au hasard, et devrait grandir quand Understat reviendra.`
        : `Le modèle avec xG ne fait <b>pas</b> mieux hors échantillon que le modèle avec les buts seuls : <b>il n'est pas adopté</b>, le site garde l'ancien modèle (a = 0).`}</p>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Hors échantillon (${o.n.toLocaleString("fr-FR")} matchs)</th><th class="r">Ancien : buts seuls</th><th class="r">Nouveau : avec xG</th></tr></thead><tbody>
      <tr><td>Réglages</td><td class="r num">${fr(`a = 0 · xi ${o.params.xi} · l2 ${o.params.l2}`)}</td><td class="r num">${fr(`a = ${nw.params.a} · xi ${nw.params.xi} · l2 ${nw.params.l2}`)}</td></tr>
      <tr><td>Log loss 1N2 (plus bas = mieux)</td><td class="r num ${better(o.logloss, nw.logloss)}">${f4(o.logloss)}</td><td class="r num ${better(nw.logloss, o.logloss)}"><b>${f4(nw.logloss)}</b></td></tr>
      <tr><td>RPS</td><td class="r num ${better(o.rps, nw.rps)}">${f3(o.rps)}</td><td class="r num ${better(nw.rps, o.rps)}">${f3(nw.rps)}</td></tr>
      <tr><td>Bon favori</td><td class="r num">${pct(o.accuracy, 1)}</td><td class="r num">${pct(nw.accuracy, 1)}</td></tr>
      <tr><td>Brier +/− 2,5 buts (moyenne historique : ${f4(o.over25_base)})</td><td class="r num ${better(o.over25_brier, nw.over25_brier)}">${f4(o.over25_brier)}</td><td class="r num ${better(nw.over25_brier, o.over25_brier)}">${f4(nw.over25_brier)}</td></tr>
      ${Object.keys(o.leagues).map(lg => Object.keys(o.leagues[lg]).map(s => `<tr><td>${NAMES[lg]} ${s} (log loss)</td><td class="r num ${better(o.leagues[lg][s], nw.leagues[lg][s])}">${f4(o.leagues[lg][s])}</td><td class="r num ${better(nw.leagues[lg][s], o.leagues[lg][s])}">${f4(nw.leagues[lg][s])}</td></tr>`).join("")).join("")}
    </tbody></table></div>
    <p class="hint" style="margin:0">Couverture xG (matchs avec xG / matchs joués). Understat était en maintenance le 14/11/2026 : les données viennent de ses copies archivées sur archive.org, incomplètes pour les saisons récentes. Sans xG, un match compte avec ses buts réels.</p>
    <div class="tablewrap"><table><thead><tr><th>Championnat</th>${seasons.map(s => `<th class="r">${s}</th>`).join("")}</tr></thead><tbody>
      ${Object.keys(cov).map(lg => `<tr><td>${NAMES[lg]}</td>${seasons.map(s => { const c = cov[lg][s]; return `<td class="r num">${c ? `${c.xg}/${c.n}` : "–"}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div>
  </section>`;
}

// ---------- vue : méthode
function viewMethod() {
  const bt = DATA.backtest, o = bt.overall;
  const dLL = (1 - o.model.logloss / o.baseline.logloss) * 100;
  const rows = [];
  LEAGUES.forEach(L => Object.entries(bt.leagues[L.code]).forEach(([s, r]) => rows.push([L.name, s, r])));
  // graphique de calibration
  const W = 440, H = 300, P = { l: 64, r: 14, t: 14, b: 40 };
  const X = v => P.l + v * (W - P.l - P.r), Y = v => H - P.b - v * (H - P.t - P.b);
  const ticks = [0, 0.2, 0.4, 0.6, 0.8, 1];
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img" aria-label="Calibration : probabilité prédite contre fréquence observée">
    ${ticks.map(t => `<line x1="${X(0)}" x2="${X(1)}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${P.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t * 100}%</text>
      <text x="${X(t)}" y="${H - P.b + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${t * 100}%</text>`).join("")}
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    <text x="${X(0.62)}" y="${Y(0.55)}" font-size="11" fill="var(--muted)" transform="rotate(-35 ${X(0.62)} ${Y(0.55)})">calibration parfaite</text>
    <polyline fill="none" stroke="var(--home)" stroke-width="2" points="${bt.calibration.map(c => X(c.pred) + "," + Y(c.obs)).join(" ")}"/>
    ${bt.calibration.map(c => `<circle cx="${X(c.pred)}" cy="${Y(c.obs)}" r="5" fill="var(--home)" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${X(c.pred)}" cy="${Y(c.obs)}" r="14" fill="transparent" data-tip="Prédit ${pct(c.pred)} → arrivé ${pct(c.obs)} (${c.n} cas)"/>`).join("")}
    <text x="${(X(0) + X(1)) / 2}" y="${H - 4}" text-anchor="middle" font-size="12" fill="var(--ink-2)">probabilité annoncée par le modèle</text>
    <text x="12" y="${(Y(0) + Y(1)) / 2}" text-anchor="middle" font-size="12" fill="var(--ink-2)" transform="rotate(-90 12 ${(Y(0) + Y(1)) / 2})">fréquence réelle</text>
  </svg>`;
  return `<div class="section-head"><div><h2>Méthode et fiabilité</h2><p>Comment les probabilités sont calculées, et ce qu'elles valent vraiment, testées sur ${o.model.n.toLocaleString("fr-FR")} matchs que le modèle n'avait jamais vus.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="v">${o.model.logloss.toFixed(3).replace(".", ",")}</div><div class="l">Log loss du modèle</div><div class="c">contre ${o.baseline.logloss.toFixed(3).replace(".", ",")} pour un pronostic naïf (−${dLL.toFixed(1).replace(".", ",")}\u202f%)</div></div>
    <div class="kpi"><div class="v">${o.model.rps.toFixed(3).replace(".", ",")}</div><div class="l">RPS (plus bas = mieux)</div><div class="c">naïf : ${o.baseline.rps.toFixed(3).replace(".", ",")} · bookmakers : ≈ 0,19–0,20</div></div>
    <div class="kpi"><div class="v">${pct(o.model.accuracy)}</div><div class="l">Bon favori désigné</div><div class="c">naïf (toujours « domicile ») : ${pct(o.baseline.accuracy)}</div></div>
    <div class="kpi"><div class="v">${DATA.model.half_life_days} j</div><div class="l">Demi-vie des données</div><div class="c">un match d'il y a ${DATA.model.half_life_days} jours compte moitié moins</div></div>
  </div>
  <div class="grid2">
    <section class="card"><h3>Des probabilités fiables ?</h3>
      <p class="hint">Quand le modèle dit 40 %, l'événement doit arriver environ 4 fois sur 10. Plus les points collent à la diagonale, plus on peut se fier aux cotes justes.</p>
      ${svg}
    </section>
    <section class="card"><h3>Résultats par championnat</h3>
      <p class="hint">Test « walk-forward » : chaque semaine, le modèle est ré-entraîné avec les seuls matchs déjà joués, puis prédit la semaine suivante.</p>
      <div class="tablewrap"><table><thead><tr><th>Championnat</th><th>Saison</th><th class="r">Matchs</th><th class="r">Log loss</th><th class="r">Naïf</th><th class="r">Bon favori</th></tr></thead>
      <tbody>${rows.map(([n, s, r]) => `<tr><td>${esc(n)}</td><td class="num" style="white-space:nowrap">${s}${s === "2026-27" ? " <small style=\"color:var(--muted)\">en cours</small>" : ""}</td><td class="r num">${r.model.n}</td><td class="r num"><b>${r.model.logloss.toFixed(3).replace(".", ",")}</b></td><td class="r num">${r.baseline.logloss.toFixed(3).replace(".", ",")}</td><td class="r num">${pct(r.model.accuracy)}</td></tr>`).join("")}</tbody></table></div>
    </section>
  </div>
  ${xgMethod()}
  <section class="card"><h3>Comment ça marche</h3><div class="prose">
    <p><b>1. Les données.</b> Tous les résultats de Ligue 1, Premier League et LaLiga depuis août 2022, saison en cours comprise (vérifiée équipe par équipe contre le classement officiel).</p>
    <p><b>2. Le modèle de Dixon-Coles.</b> Chaque équipe reçoit une note d'attaque et une note de défense. Les buts attendus d'un match se calculent ainsi : <code class="f">buts domicile = moyenne × avantage domicile × attaque(dom) × défense(ext)</code>. Le nombre de buts suit ensuite une loi de Poisson, avec une correction pour les petits scores (0-0, 1-0, 0-1, 1-1).</p>
    <p><b>3. Les matchs récents comptent plus.</b> Un match pèse <code class="f">exp(−${DATA.model.xi} × jours écoulés)</code>. Les équipes promues partent d'un niveau un peu inférieur à la moyenne, puis le modèle s'ajuste à leurs résultats.</p>
    <p><b>4. Des probabilités aux cotes.</b> <code class="f">cote juste = 1 / probabilité</code> et <code class="f">valeur = cote du bookmaker × probabilité</code>. Mise conseillée : <code class="f">Kelly = (cote × p − 1) / (cote − 1)</code>, divisé par 4 et plafonné à 5 % de la bankroll.</p>
    <p><b>5. Les données du jour.</b> Chaque matin, une tâche automatique interroge API-Football : résultats de la veille, horaires exacts, cotes de plusieurs bookmakers (1N2 et +/− 2,5 buts) et absents des matchs des 48 h à venir. Les compositions sont récupérées dans l'heure qui précède le coup d'envoi. Au-delà de 48 h, les matchs viennent du calendrier officiel (date provisoire).</p>
    <p><b>6. Modèle + marché.</b> La probabilité du marché se lit dans la cote moyenne des bookmakers, une fois leur marge retirée : <code class="f">p_marché = (1/cote) ÷ somme des (1/cote)</code>, sur les 3 issues du 1N2 et sur les 2 issues de +/− 2,5 buts. La <b>proba finale</b> = <code class="f">${String(DATA.config.w).replace(".", ",")} × modèle + ${String(Math.round((1 - DATA.config.w) * 100) / 100).replace(".", ",")} × marché</code>. Sans cotes, c'est le modèle seul (« sans marché ») et aucune reco n'est possible. ${(() => { const W = DATA.bilan && DATA.bilan.w; if (!W) return ""; return W.best == null ? `Le poids idéal sera estimé quand ${W.needed} matchs auront une cote de clôture (${W.n} pour l'instant).` : `Sur ${W.n} matchs, le poids qui aurait minimisé le log loss est <b>${String(W.best).replace(".", ",")}</b> (log loss ${ll3(W.ll_best)} contre ${ll3(W.ll_current)} avec le réglage actuel). Il n'est pas appliqué automatiquement : à changer à la main dans engine/config.py si l'écart se confirme.`; })()}</p>
    <p><b>7. Recos du jour.</b> Candidats : 1, N, 2, +2,5 et −2,5 des matchs à moins de 48 h, pas encore commencés, avec cotes ; valeur = meilleure cote × proba finale.
      <b>Sécu</b> : proba ≥ 65 %, meilleure cote ≥ 1,30, valeur ≥ 1 (on garde la plus haute proba ; cote minimale = 1 ÷ proba).
      <b>Valeur</b> : valeur ≥ 1,05 sur le 1N2 et ≥ 1,08 sur les buts (le modèle y est moins fiable), proba ≥ 35 % (on garde la plus haute valeur ; cote minimale = 1,05 ÷ proba).
      <b>Combiné</b> : 2 ou 3 matchs différents, chaque proba ≥ 55 %, chance combinée ≥ 30 % et valeur combinée ≥ 1.
      <b>Grosse cote</b> : cote ≥ 5 et valeur ≥ 1, mise fixe d'1 €, pour s'amuser.
      Mise : ¼ de Kelly <code class="f">(cote × p − 1) ÷ (cote − 1)</code> sur la meilleure cote, plafonnée à 5 % de la bankroll, minimum 0,50 €, arrondie à 0,10 € ; total des mises ≤ 40 % de la bankroll. Confiance élevée quand modèle et marché sont d'accord à 5 points près et que les absents sont connus. Si rien ne passe les filtres, il n'y a pas de reco : on n'en force jamais.</p>
    <p><b>Les limites, honnêtement.</b> Le modèle ne voit que les scores : les absents et les compositions sont affichés mais pas intégrés au calcul, pas plus que la fatigue des Coupes d'Europe. ${DATA.xg && DATA.xg.a > 0 ? "Les xG ne couvrent pas toutes les saisons récentes (Understat en maintenance, copies d'archive incomplètes) : là où ils manquent, le modèle reprend les buts réels." : "Les xG Understat sont récupérés et affichés, mais n'ont pas amélioré le backtest : le calcul reste sur les buts réels."} Les recos sont choisies avec la meilleure cote du marché, qu'on ne trouve pas forcément chez ${esc(BOOK)} : la cote minimale dit en dessous de quoi renoncer, et le Bilan juge les recos à la cote ${esc(BOOK)} (si l'API la donne) ou à la cote moyenne. Il bat nettement un pronostic naïf, mais les bookmakers font en général un peu mieux (log loss ≈ 0,97 contre ${o.model.logloss.toFixed(2).replace(".", ",")} ici). Sur le nombre de buts (+/− 2,5), ${bt.over25.base_brier - bt.over25.brier > 0.002 ? "il fait un peu mieux que la moyenne historique" : "il n'apporte quasiment rien"} (Brier ${bt.over25.brier.toFixed(4).replace(".", ",")} contre ${bt.over25.base_brier.toFixed(4).replace(".", ",")} pour la moyenne). Une « valeur » affichée est donc une piste à vérifier, pas un pari sûr.</p>
    <p><b>Prochaines étapes.</b> Tenir compte des absents dans le calcul ; compléter les xG des saisons récentes quand Understat reviendra ; Serie A et Bundesliga ; ajuster le poids modèle/marché quand le Bilan aura assez de matchs.</p>
  </div></section>`;
}

// ---------- recos du jour
const RECO_KIND = { secu: "Pari sécu", valeur: "Pari valeur", combine: "Combiné du jour", grosse: "Grosse cote · pour s'amuser" };
const RK = (DATA.recos && DATA.recos.regles && DATA.recos.regles.kelly) || { fraction: 0.25, plafond: 0.05, mise_min: 0.5, plafond_total: 0.4 };
const BOOK = (DATA.config && DATA.config.bookmaker) || "ton bookmaker";
function liveRecos() {  // on masque une reco dès qu'un de ses matchs a commencé
  const now = Date.now();
  return ((DATA.recos && DATA.recos.items) || []).filter(it => it.legs.every(l => Date.parse(l.kickoff) > now));
}
// Mises : 1/4 de Kelly (fraction calculée côté Python), min 0,50 €, arrondi à 0,10 €, total <= 40 % de la bankroll.
function recoStakes(items, bankroll) {
  const r1 = x => Math.round(x * 10) / 10, cap = bankroll * RK.plafond_total;
  let st = items.map(it => it.mise_fixe != null ? it.mise_fixe : Math.max(RK.mise_min, r1(bankroll * (it.kelly || 0))));
  const capped = items.map(() => false), sum = () => st.reduce((a, b) => a + b, 0);
  if (sum() > cap + 1e-9) {  // on réduit d'abord les mises Kelly au prorata
    const fixed = items.reduce((s, it, i) => s + (it.mise_fixe != null ? st[i] : 0), 0);
    const kel = sum() - fixed, room = cap - fixed;
    if (room > 0 && kel > 0) st = st.map((s, i) => items[i].mise_fixe != null ? s : Math.max(RK.mise_min, Math.floor(s * room / kel * 10) / 10));
  }
  for (let i = items.length - 1; i >= 0 && sum() > cap + 1e-9; i--) { st[i] = 0; capped[i] = true; }  // puis on retire la grosse cote, le combiné…
  return { stakes: st, capped, total: sum(), cap };
}
function recosBlock() {
  const items = liveRecos(), R = DATA.recos || {};
  const head = `<div class="section-head"><div><h2>Recos du jour</h2><p>Sélections des matchs à moins de 48 h qui passent tous les filtres (détail dans Méthode). Probabilité = proba finale (modèle + marché).</p></div></div>`;
  if (!items.length) return `<section class="recos" aria-label="Recos du jour">${head}
    <div class="card"><h3>Rien d'intéressant aujourd'hui</h3><p class="hint" style="margin:0">Ne pas parier fait partie de la stratégie.${R.candidats ? ` ${R.candidats} sélection(s) examinée(s) sur ${R.matchs} match(s) avec cotes : aucune ne passe les filtres.` : " Aucun match avec cotes à moins de 48 h pour l'instant."}</p></div></section>`;
  const S = recoStakes(items, state.bankroll);
  const cards = items.map((it, i) => {
    const leg = it.legs[0], single = it.legs.length === 1;
    const prefTxt = single && leg.pref ? `<div class="cmsg${leg.pref + 1e-9 < it.cote_min ? " err" : ""}">${esc(leg.pref_name || BOOK)} : ${n2(leg.pref)}${leg.pref + 1e-9 < it.cote_min ? " — sous la cote minimale : ne joue pas chez eux" : " — au-dessus de la cote minimale"}</div>` : "";
    return `<article class="reco${it.type === "grosse" ? " fun" : ""}">
      <div class="kind"><span>${RECO_KIND[it.type]}</span><span class="conf ${it.confiance}" data-tip="Élevée : modèle et marché d'accord à 5 points près et absents connus. Moyenne : une seule des deux conditions. Faible : aucune.">Confiance ${it.confiance.toLowerCase()}</span></div>
      ${it.legs.map(l => `<div class="leg"><span class="what">${esc(l.pick)}</span><small><span class="flagtag">${TAG[l.league]}</span> ${esc(l.home)} – ${esc(l.away)} · ${esc(fmtDay(l.kickoff))} à ${fmtTime(l.kickoff)}${single ? "" : ` · ${pct(l.p)} · meilleure ${n2(l.best)}`}</small></div>`).join("")}
      <dl>
        <div><dt>Cote minimale</dt><dd class="key" data-tip="${it.type === "valeur" ? "1,05 ÷ proba" : "1 ÷ proba"} : en dessous, le pari n'a plus de valeur">${n2(it.cote_min)}</dd></div>
        <div><dt>${single ? "Probabilité" : "Chance"}</dt><dd>${pct(it.chance)}</dd></div>
        <div><dt>Valeur</dt><dd data-tip="Meilleure cote × proba finale">${n2(it.valeur)}</dd></div>
        <div><dt>Meilleure cote</dt><dd data-tip="À titre d'information${single ? " : " + esc(leg.best_bk) : ""}">${n2(it.cote)}</dd></div>
        <div><dt>Cote moyenne</dt><dd>${n2(it.cote_moyenne)}</dd></div>
        ${single ? `<div><dt>Modèle / marché</dt><dd style="font-size:15px">${pct(leg.pm)} / ${pct(leg.pk)}</dd></div>` : ""}
      </dl>
      ${prefTxt}
      <ul>${it.raisons.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <div class="stakeline"><span>Mise conseillée : <b>${S.capped[i] ? "0 € (plafond de 40 % atteint)" : euro(S.stakes[i])}</b>${it.type === "grosse" ? " · mise fixe" : ""}</span>
        <button class="btn ghost" type="button" data-addreco="${i}">Ajouter au combiné</button></div>
    </article>`;
  }).join("");
  return `<section class="recos" aria-label="Recos du jour">${head}
    <div class="recos-grid">${cards}</div>
    <div class="warn">Vérifie les compositions avant de parier : elles sortent environ 40 min avant le coup d'envoi (fiche du match). Ne joue que si ta cote est au moins égale à la cote minimale. Total des mises conseillées : ${euro(S.total)} pour une bankroll de ${euro(state.bankroll)} (plafond ${Math.round(RK.plafond_total * 100)} % = ${euro(S.cap)}).</div>
  </section>`;
}
function addReco(i) {
  const it = liveRecos()[i]; if (!it) return;
  cartMsg = null;
  const blocked = [];
  it.legs.forEach(l => {
    const m = byId[l.id]; if (!m) return;
    const cur = cart.find(c => c.id === m.id);
    if (cur && cur.k === l.k) return;
    if (cur) { blocked.push(`${m.home} – ${m.away} (déjà « ${pickName(cur)} »)`); return; }
    const info = pickInfo(m, l.k);
    cart.push({ id: m.id, slug: m.slug, league: m.league, home: m.home, away: m.away, kickoff: m.kickoff, k: l.k,
      odds: info.odds ? n2(info.odds) : "", src: info.src, pModel: info.pModel, pMkt: info.pMkt });
  });
  if (blocked.length) cartMsg = { err: true, text: `Une seule sélection par match : non ajouté pour ${blocked.join(", ")}.` };
  saveCart(); renderCart(); openCart();
}

// ---------- combiné (panier gardé dans le navigateur)
const PICKS = { h: "1", d: "N", a: "2", o25: "+2,5", u25: "−2,5" };
const PICK_LONG = { h: "Victoire ", d: "Match nul", a: "Victoire ", o25: "Plus de 2,5 buts", u25: "Moins de 2,5 buts" };
const byId = Object.fromEntries(MATCHES.map(m => [m.id, m]));
let cart = store.get("panier", []);
if (!Array.isArray(cart)) cart = [];
let cartMsg = null;

function pickInfo(m, k) {  // pModel = proba finale (modèle + marché), ou modèle seul si pas de cotes
  const pModel = m.pf ? m.pf[k] : { h: m.p.h, d: m.p.d, a: m.p.a, o25: m.markets.over25, u25: 1 - m.markets.over25 }[k];
  const pMkt = m.pk && m.pk[k] != null ? m.pk[k] : null;
  const saved = store.get("odds:" + m.slug, {}), mine = saved[k] ? parseNum(saved[k]) : NaN;
  const median = m.odds && m.odds.median ? m.odds.median[k] : null;
  const book = m.odds && m.odds.pref && m.odds.pref.odds ? m.odds.pref.odds[k] : null;
  const odds = mine > 1 ? mine : book || median || null;
  return { pModel, pMkt, median: book || median, odds, src: mine > 1 ? "ta cote" : book ? m.odds.pref.name : median ? "médiane bookmakers" : "" };
}
const inCart = (id, k) => cart.some(c => c.id === id && c.k === k);
const pickName = (c) => c.k === "h" ? PICK_LONG.h + c.home : c.k === "a" ? PICK_LONG.a + c.away : PICK_LONG[c.k];
function pickBtn(m, k) {
  const i = pickInfo(m, k);
  const shown = i.median ? `<b>${n2(i.median)}</b>` : `<b>${odd(i.pModel)}</b>`;
  const tipTxt = i.median ? `Cote ${i.src === "médiane bookmakers" ? "médiane des bookmakers" : esc(i.src)} · proba finale ${pct(i.pModel)}` : `Pas encore de cote bookmaker : cote juste du modèle seul (${pct(i.pModel)})`;
  return `<button class="pick${i.median ? "" : " fair"}" type="button" data-pick="${m.slug}|${k}" aria-pressed="${inCart(m.id, k)}" data-tip="${esc(tipTxt)}">${PICKS[k]}${shown}</button>`;
}
function saveCart() { store.set("panier", cart); }
function togglePick(slug, k) {
  const m = bySlug[slug]; if (!m) return;
  const idx = cart.findIndex(c => c.id === m.id);
  cartMsg = null;
  if (idx >= 0 && cart[idx].k === k) { cart.splice(idx, 1); }
  else if (idx >= 0) {
    cartMsg = { err: true, text: `Une seule sélection par match : « ${pickName(cart[idx])} » est déjà dans le combiné pour ${m.home} – ${m.away}. Retire-la d'abord.` };
    openCart();
  } else {
    const i = pickInfo(m, k);
    cart.push({ id: m.id, slug, league: m.league, home: m.home, away: m.away, kickoff: m.kickoff, k,
      odds: i.odds ? n2(i.odds) : "", src: i.src, pModel: i.pModel, pMkt: i.pMkt });
  }
  saveCart(); renderCart();
}
function cartLines() {  // probabilités relues dans les données du jour si le match y est encore
  return cart.map(c => {
    const m = byId[c.id], i = m ? pickInfo(m, c.k) : null;
    return Object.assign({}, c, { pModel: i ? i.pModel : c.pModel, pMkt: i ? i.pMkt : c.pMkt, o: parseNum(c.odds) });
  });
}
function cartTotals() {
  const L = cartLines(), prod = a => a.reduce((x, y) => x * y, 1);
  const allOdds = L.length && L.every(c => c.o > 1), allMkt = L.length && L.every(c => c.pMkt != null);
  const odds = allOdds ? prod(L.map(c => c.o)) : null, pm = L.length ? prod(L.map(c => c.pModel)) : null;
  const pk = allMkt ? prod(L.map(c => c.pMkt)) : null;
  const stake = parseNum(store.get("cartStake", "2")) || 0;
  return { L, odds, pm, pk, value: odds && pm ? odds * pm : null, mktValue: odds && pk ? odds * pk : null, stake };
}
function verdictOf(v) {
  if (v == null) return `<span class="verdict none">—</span>`;
  const cls = v >= 1.05 ? "good" : v >= 1 ? "fair" : "bad";
  return `<span class="verdict ${cls}">${v >= 1.05 ? "✓ Valeur" : v >= 1 ? "≈ Juste prix" : "✕ Pas de valeur"} ${n2(v)}</span>`;
}
function renderCart() {
  const btn = document.getElementById("cart-btn");
  btn.hidden = !cart.length || document.getElementById("cart").classList.contains("open");
  btn.textContent = `Combiné · ${cart.length}`;
  document.querySelectorAll("[data-pick]").forEach(b => { const [s, k] = b.dataset.pick.split("|"); const m = bySlug[s]; b.setAttribute("aria-pressed", String(!!m && inCart(m.id, k))); });
  const T = cartTotals(), now = Date.now();
  document.getElementById("cart-body").innerHTML =
    (cartMsg ? `<div class="cmsg${cartMsg.err ? " err" : ""}" role="alert">${esc(cartMsg.text)}</div>` : "") +
    (T.L.length > 3 ? `<div class="cmsg" role="status">⚠ ${T.L.length} sélections : chaque match ajouté multiplie la marge du bookmaker.${T.mktValue ? ` Ici, le marché ne te rend que ${pct(T.mktValue)} de ta mise en moyenne (marge cumulée ${pct(1 - T.mktValue)}).` : ""}</div>` : "") +
    (T.L.length ? T.L.map((c, i) => `<div class="citem">
      <div class="top"><div><span class="flagtag">${TAG[c.league] || ""}</span> ${esc(c.home)} – ${esc(c.away)}${Date.parse(c.kickoff) < now ? ` <span class="flagtag">COMMENCÉ</span>` : ""}
        <div class="sel">${esc(pickName(c))}</div></div>
        <button class="xbtn" type="button" data-cart-rm="${i}" aria-label="Retirer ${esc(pickName(c))}">×</button></div>
      <div class="row"><label>Cote <input class="cart-odds" data-i="${i}" inputmode="decimal" value="${esc(c.odds)}" placeholder="à saisir" aria-label="Cote pour ${esc(pickName(c))}"></label>
        <span>proba finale ${pct(c.pModel, 1)}</span><span>marché ${c.pMkt != null ? pct(c.pMkt, 1) : "–"}</span></div>
      ${c.src ? `<span class="stamp">cote pré-remplie : ${esc(c.src)}</span>` : `<span class="stamp">pas de cote bookmaker pour l'instant : saisis la tienne</span>`}
    </div>`).join("") : `<p class="hint" style="margin:0">Ton combiné est vide. Clique sur 1, N, 2, +2,5 ou −2,5 sous un match pour l'ajouter.</p>`);
  document.getElementById("cart-foot").innerHTML = T.L.length ? `
    <div class="ctot"><span>Cote combinée</span><b id="ct-odds">${T.odds ? n2(T.odds) : "complète les cotes"}</b></div>
    <div class="ctot"><span>Chance (proba finale)</span><b id="ct-pm">${pct(T.pm, 1)}</b></div>
    <div class="ctot"><span>Chance selon le marché</span><b id="ct-pk">${T.pk != null ? pct(T.pk, 1) : "–"}</b></div>
    <div class="ctot big"><span>Valeur (cote × chance)</span><b id="ct-val">${verdictOf(T.value)}</b></div>
    <div class="ctot"><label for="cart-stake">Mise</label><span><input id="cart-stake" inputmode="decimal" value="${esc(String(store.get("cartStake", "2")))}"> €</span></div>
    <div class="ctot"><span>Gain si tout passe</span><b id="ct-gain">${T.odds ? euro(T.stake * T.odds) + ` (bénéfice ${euro(T.stake * (T.odds - 1))})` : "–"}</b></div>
    <p class="stamp" style="margin:0">Chances multipliées comme si les matchs étaient indépendants. <button class="linkbtn" id="cart-clear" type="button">Vider le combiné</button></p>` : "";
}
function updateCartTotals() {  // pendant la saisie : on ne redessine que les totaux (le curseur reste en place)
  const T = cartTotals(); const set = (id, h) => { const el = document.getElementById(id); if (el) el.innerHTML = h; };
  set("ct-odds", T.odds ? n2(T.odds) : "complète les cotes"); set("ct-val", verdictOf(T.value));
  set("ct-gain", T.odds ? euro(T.stake * T.odds) + ` (bénéfice ${euro(T.stake * (T.odds - 1))})` : "–");
}
function openCart() { const c = document.getElementById("cart"); c.classList.add("open"); c.setAttribute("aria-hidden", "false"); document.getElementById("cart-btn").hidden = true; }
function closeCart() { const c = document.getElementById("cart"); c.classList.remove("open"); c.setAttribute("aria-hidden", "true"); cartMsg = null; renderCart(); }

// ---------- routage
function route() {
  const h = (location.hash || "#matchs").slice(1);
  const app = document.getElementById("app");
  if (h.startsWith("m-") && bySlug[h]) { setTab("matchs"); app.innerHTML = viewMatch(bySlug[h]); updateCalc(h); document.title = bySlug[h].home + " – " + bySlug[h].away + " · CoteJuste"; window.scrollTo(0, 0); return; }
  document.title = "CoteJuste";
  if (h === "classements") { setTab("classements"); app.innerHTML = viewStandings(); return; }
  if (h === "methode") { setTab("methode"); app.innerHTML = viewMethod(); return; }
  if (h === "bilan") { setTab("bilan"); app.innerHTML = viewBilan(); const B = DATA.bilan; if (B && B.series) setupChart((B.series[state.bilanSerie] || B.series.toutes_finale).bets); return; }
  setTab("matchs"); app.innerHTML = viewMatches();
}

document.addEventListener("click", e => {
  const pk = e.target.closest("[data-pick]");
  if (pk) { e.preventDefault(); const [s, k] = pk.dataset.pick.split("|"); togglePick(s, k); return; }
  const ar = e.target.closest("[data-addreco]");
  if (ar) { addReco(+ar.dataset.addreco); return; }
  const rm = e.target.closest("[data-cart-rm]");
  if (rm) { cart.splice(+rm.dataset.cartRm, 1); cartMsg = null; saveCart(); renderCart(); return; }
  if (e.target.id === "cart-btn") { cartMsg = null; renderCart(); openCart(); return; }
  if (e.target.id === "cart-close") { closeCart(); return; }
  if (e.target.id === "cart-clear") { cart = []; cartMsg = null; saveCart(); renderCart(); return; }
  if (e.target.id === "reset-odds") {
    document.querySelectorAll(".valtable input").forEach(inp => { inp.value = inp.dataset.api || ""; });
    updateCalc((location.hash || "").slice(1));
    return;
  }
  const bs = e.target.closest("[data-bserie]");
  if (bs) { state.bilanSerie = bs.dataset.bserie; store.set("bilanSerie", state.bilanSerie); route(); return; }
  const b = e.target.closest("[data-league]");
  if (b) { state.league = b.dataset.league; store.set("league", state.league); route(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "bankroll") { const v = parseNum(e.target.value); if (v > 0) { state.bankroll = v; store.set("bankroll", v); } }
  if (e.target.closest(".valtable")) updateCalc((location.hash || "").slice(1));
  if (e.target.classList.contains("cart-odds")) { cart[+e.target.dataset.i].odds = e.target.value.trim(); cart[+e.target.dataset.i].src = "ta cote"; saveCart(); updateCartTotals(); }
  if (e.target.id === "cart-stake") { store.set("cartStake", e.target.value.trim()); updateCartTotals(); }
});
document.addEventListener("change", e => {  // bankroll modifiée : on recalcule les mises des recos
  if (e.target.id === "bankroll" && (location.hash || "#matchs") === "#matchs") route();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("cart").classList.contains("open")) closeCart(); });
// infobulles
const tip = document.getElementById("tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.classList.remove("on"); return; }
  tip.textContent = t.getAttribute("data-tip");
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = (y + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : y) + "px";
  tip.classList.add("on");
});
document.addEventListener("pointerleave", () => tip.classList.remove("on"));
window.addEventListener("hashchange", route);
renderChrome();
route();
renderCart();
})();
</script>
</body>
</html>
